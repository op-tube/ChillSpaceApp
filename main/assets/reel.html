        try { await feedLoad; } finally { feedLoad = null; }
    }
    let dataReady = false;
    const choose = values => values[Math.floor(Math.random() * values.length)];

    // Keep XML external. Website paths stay same-origin; Android uses bundled assets.
    const selectedXml = new Map();
    function parseLocalXml(text, filename) {
        if (typeof text !== 'string' || !text.trim()) throw new Error('Empty ' + filename);
        const xml = new DOMParser().parseFromString(text, 'application/xml');
        if (xml.querySelector('parsererror')) throw new Error('Invalid XML in ' + filename);
        if (Object.values(storyLanguages).some(config => config.file === filename)) {
            const codes = filename === 'stories.xml' ? Array.from(xml.querySelectorAll('language'), node => node.getAttribute('code')).filter(code => code === 'en' || code === 'ko')
                : Object.keys(storyLanguages).filter(code => storyLanguages[code].file === filename);
            if (!codes.length) throw new Error(filename + ': no supported story language');
            for (const code of codes) readLanguageData(xml, code, filename);
        } else if (!validFeedNode(xml.documentElement)) {
            throw new Error('Expected ChillSpace language data in ' + filename);
        }
        return xml;
    }
    function readAssetXHR(url) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.timeout = 4000;
            xhr.onload = () => (xhr.status === 200 || (xhr.status === 0 && xhr.responseText))
                ? resolve(xhr.responseText) : reject(new Error('HTTP ' + xhr.status));
            xhr.onerror = () => reject(new Error('Asset request blocked'));
            xhr.ontimeout = () => reject(new Error('Asset request timed out'));
            xhr.send();
        });
    }
    async function loadLocalXml(filename) {
        if (selectedXml.has(filename)) return selectedXml.get(filename);
        const failures = [];
        if (window.AndroidUtils && typeof AndroidUtils.loadAsset === 'function') {
            try { return parseLocalXml(await AndroidUtils.loadAsset(filename), filename); }
            catch (error) { failures.push('Android asset: ' + error.message); }
        }
        const web = /^https?:$/.test(location.protocol);
        const urls = Array.from(new Set(web
            ? [new URL(filename, location.href).href, new URL('/' + filename, location.origin).href]
            : [new URL(filename, location.href).href, 'file:///android_asset/' + filename]));
        for (const url of urls) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 4000);
            try {
                const response = await fetch(url, { signal: controller.signal });
                if (!response.ok && !(location.protocol === 'file:' && response.status === 0)) throw new Error('HTTP ' + response.status);
                return parseLocalXml(await response.text(), filename);
            } catch (error) { failures.push(url + ': ' + error.message); }
            finally { clearTimeout(timeout); }
            // Some Android WebViews reject fetch(file:) but support XMLHttpRequest.
            if (!web) {
                try { return parseLocalXml(await readAssetXHR(url), filename); }
                catch (error) { failures.push(url + ': ' + error.message); }
            }
        }
        throw new Error(failures.join('\n') || 'Could not read ' + filename);
    }
    const storyDocuments = new Map();
    function readLanguageData(xml, code, filename) {
        const node = xml.querySelector('language[code="' + code + '"]');
        if (!node) throw new Error(filename + ': missing language ' + code);
        const data = {};
        for (const group of ['topics', 'relationships', 'templates']) {
            data[group] = Array.from(node.querySelectorAll(group + ' > item'), n => n.textContent.trim()).filter(Boolean);
            if (!data[group].length) throw new Error(filename + ': missing ' + code + ' ' + group);
        }
        data.variables = readStoryVariables(node);
        validateStoryVariables(data.templates, data.variables);
        return data;
    }
    async function loadStoryData(code = currentLang) {
        if (storyData[code]) return;
        const filename = storyLanguages[code].file;
        const xml = selectedXml.get(filename) || storyDocuments.get(filename) || await loadLocalXml(filename);
        storyData[code] = readLanguageData(xml, code, filename);
        storyDocuments.set(filename, xml);
    }
    function readStoryVariables(node) {
        const variables = Object.create(null);
        for (const element of node.querySelectorAll('variables > variable')) {
            const name = element.getAttribute('name');
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name || '') || name === 'topic' || name === 'rel' || Object.prototype.hasOwnProperty.call(variables, name)) {
                throw new Error('Invalid or duplicate story variable: ' + name);
            }
            const options = Array.from(element.querySelectorAll(':scope > item'), item => item.textContent.trim()).filter(Boolean);
            if (!options.length) throw new Error('Empty story variable: ' + name);
            variables[name] = options;
        }
        return variables;
    }
    function storyTokens(text) {
        // Accept both ${variable} and {variable}; topic and rel stay fixed for each story.
        return Array.from(text.matchAll(/\$?\{([A-Za-z_][A-Za-z0-9_]*)\}/g), match => match[1]);
    }
    function validateStoryVariables(templates, variables) {
        const complete = new Set(['topic', 'rel']);
        function visit(name, path = new Set()) {
            if (complete.has(name)) return;
            if (!Object.prototype.hasOwnProperty.call(variables, name)) throw new Error('Unknown story variable: ' + name);
            if (path.has(name)) throw new Error('Circular story variable: ' + name);
            const next = new Set(path); next.add(name);
            variables[name].forEach(option => storyTokens(option).forEach(child => visit(child, next)));
            complete.add(name);
        }
        Object.keys(variables).forEach(name => visit(name));
        templates.forEach(template => storyTokens(template).forEach(name => visit(name)));
    }
    function renderStoryTemplate(template, topic, rel, variables) {
        function expand(text, depth = 0) {
            if (depth > 20) throw new Error('Story variables are nested too deeply');
            return text.replace(/\$?\{([A-Za-z_][A-Za-z0-9_]*)\}/g, (_, name) => {
                if (name === 'topic') return topic;
                if (name === 'rel') return rel;
                if (!Object.prototype.hasOwnProperty.call(variables, name)) throw new Error('Unknown story variable: ' + name);
                return expand(choose(variables[name]), depth + 1);
            });
        }
        // Escape substituted content, retaining only the template's original markup.
        return template.replace(/\$?\{([A-Za-z_][A-Za-z0-9_]*)\}/g, (_, name) => escapeText(expand('${' + name + '}')));
    }
    function getTopics() { return storyData[currentLang].topics; }
    function getRelations() { return storyData[currentLang].relationships; }
    function getTemplates() { return storyData[currentLang].templates; }
    function feedData(lang) {
        const node = lang && feedXml ? findFeedNode(feedXml, lang) : feedNode;
        const names = tag => (node?.querySelector('names > ' + tag)?.textContent || '').split(',').map(s => s.trim()).filter(Boolean);
        return { first: names('first'), last: names('last'), posts: Array.from(node?.querySelectorAll('linesb > item') || [], n => n.textContent.trim()).filter(Boolean) };
    }
    function makeCreator() {
        const data = feedData('en');
        const slug = value => value.toLowerCase().replace(/[^a-z0-9]/g, '');
        return { name: '@' + slug(choose(data.first.length ? data.first : ['Alex', 'Sam', 'Jordan', 'Taylor', 'Riley'])) + '_' + slug(choose(data.last.length ? data.last : ['Smith', 'Chen', 'Patel', 'Garcia', 'Kim'])) + '_' + Math.floor(Math.random() * 100000), color: 'hsl(' + Math.floor(Math.random() * 360) + ', 68%, 48%)' };
    }

    /* Insert a dance break every ~6-11 slides (never as the very first slide). */
    function insertDanceSlides(stories) {
        const out = [];
        let since = 0;
        let gap = 5 + Math.floor(Math.random() * 5);
        stories.forEach(s => {
            out.push(s);
            since++;
            if (since >= gap) {
                out.push({
                    isDance: true,
                    topic: 'dance',
                    rel: 'dance',
                    plainText: '',
                    htmlText: '',
                    seed: (Math.random() * 4294967296) >>> 0
                });
                since = 0;
                gap = 6 + Math.floor(Math.random() * 6);
            }
        });
        out.forEach((s, i) => { s.id = i + 1; });
        return out;
    }

    function generateStories(count) {
        const topics = getTopics();
        const relations = getRelations();
        const templates = getTemplates();
        const stories = [];
        const usedCombos = new Set();
        while (stories.length < Math.min(count, templates.length * topics.length * relations.length)) {
            const tpl = templates[Math.floor(Math.random() * templates.length)];
            const topic = topics[Math.floor(Math.random() * topics.length)];
            const rel = relations[Math.floor(Math.random() * relations.length)];
            const key = `${tpl}|||${topic}|||${rel}`;
            if (!usedCombos.has(key)) {
                usedCombos.add(key);
                const htmlText = renderStoryTemplate(tpl, topic, rel, storyData[currentLang].variables);
                const plainText = new DOMParser().parseFromString(htmlText, 'text/html').body.textContent;
                stories.push({ topic, rel, htmlText, plainText, id: stories.length + 1 });
            }
        }
        for (let i = stories.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [stories[i], stories[j]] = [stories[j], stories[i]];
        }
        return insertDanceSlides(stories);
    }

    function rebuildStories() {
        likedStories.clear();
        bookmarkedStories.clear();
        allStories = generateStories(130);
    }

    const likeSVG = '<svg class="like-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>';
    function escapeText(value) { const el = document.createElement('span'); el.textContent = value; return el.innerHTML; }
    function formatCount(num) {

        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';

    }

    function pickReelPitch(previous) {
        const levels = [0.65, 0.8, 1.0, 1.25, 1.5];

        return choose(candidates);

    function buildSlides() {

            if (!story.isDance) {
                story.ttsPitch ??= pickReelPitch(previousPitch);
                previousPitch = story.ttsPitch;
            }
            story.likeCount = likeCount;
            slide.innerHTML = `
                <div class="word-caption" aria-hidden="true"></div>
                <p class="sr-only">${escapeText(story.plainText)}</p>
                <div class="creator-row"><span class="creator-avatar" style="background:${story.creator.color}" aria-hidden="true">${story.creator.name.slice(1,2).toUpperCase()}</span><span class="creator-name">${escapeText(story.creator.name)}</span></div>
                <div class="side-actions">
                    <button class="side-action like-btn" aria-label="Like" aria-pressed="false" data-index="${index}"><span class="icon-circle">${likeSVG}</span><span class="action-label like-count">${formatCount(likeCount)}</span></button>
                    <button class="side-action comment-btn" data-index="${index}"><span class="icon-circle">💬</span><span class="action-label">${formatCount(commentCount)}</span></button>
                    <button class="side-action"><span class="icon-circle">↗️</span><span class="action-label">${formatCount(shareCount)}</span></button>
                    <button class="side-action bookmark-btn" data-index="${index}"><span class="icon-circle">🔖</span><span class="action-label">${ui[currentLang].save}</span></button>

    let commentsBusy = false;
    let commentOpener = null;
    function appendComments() {
        if (commentsBusy || !commentOverlay.classList.contains('show')) return;
        commentsBusy = true;
        const data = feedData();
        if (!data.posts.length || !data.first.length || !data.last.length) {
            commentList.textContent = currentLang === 'ko' ? '댓글을 불러올 수 없습니다. lang.xml을 확인하세요.' : 'Comments unavailable. Check ' + commentLanguage + '.xml or lang.xml and reopen to retry.';
            commentsBusy = false;
            return;
        }
        const fragment = document.createDocumentFragment();

            const row = document.createElement('div'); row.className = 'comment';
            const avatar = document.createElement('span'); avatar.className = 'comment-avatar';
            avatar.style.background = 'hsl(' + Math.floor(Math.random() * 360) + ', 65%, 45%)';
            const body = document.createElement('div');
            const name = document.createElement('div'); name.className = 'user';
            name.textContent = choose(data.first) + ' ' + choose(data.last);
            avatar.textContent = name.textContent.slice(0,1);

    async function showComments(index) {
        if (!allStories[index]) return;

    let observer = null;

    function setupIntersectionObserver() {
        if (observer) observer.disconnect();

            let maxRatio = 0, mostVisible = activeIndex;
            entries.forEach(e => {
                if (e.isIntersecting && e.intersectionRatio > maxRatio) {

                const prev = activeIndex;
                activeIndex = mostVisible;

    let currentTTSIndex = -1;
    let autoTTSTimeout = null;

    function onSlideChange(prev, curr) {
        stopTTS();
        if (autoTTSTimeout) { clearTimeout(autoTTSTimeout); autoTTSTimeout = null; }
        const story = allStories[curr];
        const seed = storySeed(curr);
        const theme = randomTheme();

        if (story && story.isDance) {
            bg.setScene('dance', { theme: theme, tempo: ChillSpaceMusic.getTempo(seed) });
        } else {
            bg.setScene(pickRandomGame(), { theme: theme });
        }

        ChillSpaceMusic.play(seed);
        showMusicIndicator();

        if (audioInitialized && story && !story.isDance) {
            autoTTSTimeout = setTimeout(() => {
                if (activeIndex === curr && currentTTSIndex === -1) speakStory(curr);
            }, 400);
        }
    }

    function showMusicIndicator() {

    }

    function stopTTS() {

        completedNarration = null;
        clearTimeout(captionTimer);
        clearTimeout(advanceTimer);

        if (window.speechSynthesis) window.speechSynthesis.cancel();

    }

    function speakStory(index) {
        if (!audioInitialized) return;
        const story = allStories[index];
        if (!story || story.isDance) return;
        if (currentTTSIndex === index && (window.speechSynthesis?.speaking)) {
            stopTTS();
            return;
        }
        stopTTS();
        currentTTSIndex = index;
        speakText(story.plainText, currentLang);
    }

    function startAudioAndTTS() {
        if (audioInitialized) return;
        audioInitialized = true;
        ChillSpaceMusic.play(storySeed(activeIndex));
        speakStory(activeIndex);
    }

    const likedStories = new Set();
    const bookmarkedStories = new Set();

    function toggleLike(index, btn) {
        const key = `story-${index}`;
        const label = btn.querySelector('.like-count');
        if (likedStories.has(key)) {
            likedStories.delete(key);
            btn.classList.remove('liked');
            label.textContent = formatCount(--allStories[index].likeCount);
            btn.setAttribute('aria-pressed', 'false');

            likedStories.add(key);

    }

    function parseCount(s) { if (s.endsWith('M')) return parseFloat(s) * 1000000; if (s.endsWith('K')) return parseFloat(s) * 1000; return parseInt(s) || 0; }

    function spawnHeartBurst(el) {
        const rect = el.getBoundingClientRect();
        const heart = document.createElement('div');
        heart.className = 'heart-burst';
        heart.innerHTML = likeSVG;
        heart.style.color = '#22c55e';
        heart.style.left = rect.left + rect.width / 2 - 20 + 'px';
        heart.style.top = rect.top + 'px';
        document.body.appendChild(heart);
        heart.addEventListener('animationend', () => heart.remove());

    function toggleBookmark(index, btn) {

        else { bookmarkedStories.add(key); icon.textContent = '📌'; }
    }

    function setupEvents() {
        scrollContainer.addEventListener('click', (e) => {
            const likeBtn = e.target.closest('.like-btn');
            if (likeBtn) { e.preventDefault();
                const idx = parseInt(likeBtn.dataset.index); if (!isNaN(idx)) toggleLike(idx, likeBtn); return; }
            const bookmarkBtn = e.target.closest('.bookmark-btn');
            if (bookmarkBtn) { e.preventDefault();
                const idx = parseInt(bookmarkBtn.dataset.index); if (!isNaN(idx)) toggleBookmark(idx, bookmarkBtn); return; }
            const commentBtn = e.target.closest('.comment-btn');
            if (commentBtn) { e.preventDefault();
                const idx = parseInt(commentBtn.dataset.index); if (!isNaN(idx)) showComments(idx); return; }

        });
        scrollContainer.addEventListener('dblclick', (e) => {
            if (e.target.closest('button')) return;
            const slide = e.target.closest('.slide');
            if (slide) { const idx = parseInt(slide.dataset.index);
                const likeBtn = slide.querySelector('.like-btn'); if (!isNaN(idx) && likeBtn && !likedStories.has(`story-${idx}`)) toggleLike(idx, likeBtn); }
        });
        document.addEventListener('keydown', (e) => {
            if (commentOverlay.classList.contains('show')) return;
            if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); scrollToSlide(activeIndex + 1); }
            else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); scrollToSlide(activeIndex - 1); }
            else if (e.key === 'l') { e.preventDefault();
                const slide = document.querySelector(`.slide[data-index="${activeIndex}"]`); if (slide) {
                    const lb = slide.querySelector('.like-btn'); if (lb && !likedStories.has(`story-${activeIndex}`)) toggleLike(activeIndex, lb); } }
        });
    }

    function scrollToSlide(index) {
        const clamped = Math.max(0, Math.min(index, allStories.length - 1));
        const slide = document.querySelector(`.slide[data-index="${clamped}"]`);
        if (slide) slide.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function syncLanguageUI() {
        const labels = ui[currentLang];
        document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : currentLang;
        badgeText.textContent = '📖 ' + labels.stories;
        langToggle.value = currentLang;
        autoscrollToggle.textContent = labels.auto + ': ' + (isAutoscrollEnabled ? labels.on : labels.off);
        startSub.textContent = labels.hint;
        loadReelSpaceBtn.textContent = labels.start;
        document.getElementById('chooseStoriesBtn').textContent = 'Choose ' + storyLanguages[currentLang].file;
    }
    async function switchLanguage(lang) {
        if (initializing || !storyLanguages[lang] || lang === currentLang) return;

        langToggle.disabled = true;
        const notice = document.getElementById('languageStatus');
        notice.hidden = true;

            await loadStoryData(lang);
            stopTTS();
            closeComments();
            currentLang = lang;
            syncLanguageUI();
            rebuildStories();
            buildSlides();
            if (audioInitialized) onSlideChange(0, 0);
        } catch (error) {
            console.warn('ReelSpace language load failed:', error);

            notice.textContent = ui[currentLang].failed;
            notice.hidden = false;
        } finally { langToggle.disabled = false; }
    }

    loadReelSpaceBtn.addEventListener('click', () => {
        if (!dataReady) { init(); return; }

        startOverlay.classList.add('hidden-display');
        startAudioAndTTS();
    });

    langToggle.addEventListener('change', (e) => {

    document.addEventListener('keydown', (e) => {
        if ((e.key === ' ' || e.key === 'Enter') && !startOverlay.classList.contains('hidden')) {

            loadReelSpaceBtn.click();

    });

    closeCommentsBtn.addEventListener('click', () => {

    });

    document.getElementById('chooseStoriesBtn').addEventListener('click', () => {
        document.getElementById('storiesFileInput').click();
    });
    document.getElementById('storiesFileInput').addEventListener('change', async event => {
        const file = event.target.files[0];
        if (!file) return;
        try {
            const text = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Could not read the selected file.'));
                reader.readAsText(file);
            });
            const filename = storyLanguages[currentLang].file;
            selectedXml.set(filename, parseLocalXml(text, filename));
            delete storyData[currentLang];
            await init();
        } catch (error) {
            startSub.textContent = 'Choose the correct ReelSpace story file: ' + storyLanguages[currentLang].file;
            document.getElementById('loadErrorDetails').textContent = error.message;
        } finally { event.target.value = ''; }
    });

    let initializing = false, eventsReady = false;
    async function init() {
        if (initializing) return;
        initializing = true;
        loadReelSpaceBtn.disabled = true;
        langToggle.disabled = true;
        syncLanguageUI();
        startSub.textContent = ui[currentLang].loading;
        try {
            await Promise.all([loadStoryData(), loadCommentFeed().catch(() => {})]);
        } catch (error) {
            startSub.textContent = /^https?:$/.test(location.protocol)
                ? 'Could not load ' + storyLanguages[currentLang].file + '. Put it beside this page or in the site root, then retry, or choose the file below.'
                : 'Choose ' + storyLanguages[currentLang].file + ' from your local folder to continue.';
            document.getElementById('chooseStoriesBtn').hidden = false;
            document.getElementById('loadDiagnostics').hidden = false;
            document.getElementById('loadErrorDetails').textContent = error.message;
            loadReelSpaceBtn.textContent = 'Retry';
            loadReelSpaceBtn.disabled = false;
            initializing = false;
            langToggle.disabled = false;
            return;
        }
        document.getElementById('chooseStoriesBtn').hidden = true;
        document.getElementById('loadDiagnostics').hidden = true;
        dataReady = true;
        initializing = false;
        loadReelSpaceBtn.disabled = false;
        langToggle.disabled = false;
        syncLanguageUI();
        rebuildStories();
        buildSlides();
        if (!eventsReady) { setupEvents(); eventsReady = true; }
        if (window.speechSynthesis) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }
        console.log('🚀 ReelSpace ready – click "Load ReelSpace" to begin.');
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>
</body>
</html>
