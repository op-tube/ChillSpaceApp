            /* ── SYNTH LEAD ── */
            if (profile.hasLead && profile.leadCount > 0) {
                for (let i = 0; i < profile.leadCount; i++) {
                    const t = i * (totalBeats / profile.leadCount) + rnd() * 0.4;
                    const d = Math.floor(rnd() * scale.length) + 7;
                    events.push({
                        time: t,
                        duration: 0.6 + rnd() * 0.9,
                        kind: 'synth',
                        notes: [degToMidi(keyPc, scale, d, profile.synthOct)],
                        velocity: profile.synthVol
                    });
                }
            }

            events.sort((a, b) => a.time - b.time);
            return { tempo, bars, beatsPerBar: 4, totalBeats, events, seed, profile };
        }

        const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

        /* ────────────────────────────────────────────────────────────────
           LoopPlayer
           ──────────────────────────────────────────────────────────────── */
        class LoopPlayer {
            constructor(ctx, dest, song) {
                this.ctx = ctx;
                this.dest = dest;
                this.song = song;
                this.profile = song.profile || {};
                this.secPerBeat = 60 / song.tempo;
                this.loopSeconds = song.totalBeats * this.secPerBeat;
                this.out = ctx.createGain();
                this.out.gain.value = 0;
                this.out.connect(dest);
                this.running = false;
                this.timer = null;
                this.loopStartTime = 0;
                this.loopIteration = 0;
                this.eventIndex = 0;
                this.sources = new Set();

                const nSamples = Math.floor(ctx.sampleRate * 0.5);
                this.noiseBuffer = ctx.createBuffer(1, nSamples, ctx.sampleRate);
                const nd = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < nSamples; i++) nd[i] = Math.random() * 2 - 1;
            }

            start(when, fadeIn) {
                this.running = true;
                this.loopStartTime = when;
                this.loopIteration = 0;
                this.eventIndex = 0;
                const g = this.out.gain;
                g.cancelScheduledValues(when);
                g.setValueAtTime(0.0001, when);
                g.exponentialRampToValueAtTime(1, when + (fadeIn || 0.5));
                this.timer = setInterval(() => this.tick(), 25);
                this.tick();
            }

            tick() {
                if (!this.running) return;
                const ctx = this.ctx;
                const horizon = ctx.currentTime + 0.35;
                let guard = 0;
                while (guard++ < 1000) {
                    if (this.eventIndex >= this.song.events.length) {
                        this.eventIndex = 0;
                        this.loopIteration++;
                        continue;
                    }
                    const ev = this.song.events[this.eventIndex];
                    const absTime = this.loopStartTime
                                  + this.loopIteration * this.loopSeconds
                                  + ev.time * this.secPerBeat;
                    if (absTime > horizon) break;
                    if (absTime >= ctx.currentTime - 0.02) {
                        this.schedule(ev, absTime);
                    }
                    this.eventIndex++;
                }
            }

            schedule(ev, when) {
                switch (ev.kind) {
                    case 'kick':   this.kick(ev, when);   break;
                    case 'snare':  this.snare(ev, when);  break;
                    case 'hat':    this.hat(ev, when);    break;
                    case 'bass':   this.bass(ev, when);   break;
                    case 'pad':    this.pad(ev, when);    break;
                    case 'guitar': this.guitar(ev, when); break;
                    case 'arp':    this.arp(ev, when);    break;
                    case 'synth':  this.synth(ev, when);  break;
                }
            }

            _track(node, stopAt) {
                this.sources.add(node);
                const ms = Math.max(0, (stopAt - this.ctx.currentTime + 0.5) * 1000);
                setTimeout(() => this.sources.delete(node), ms);
            }

            kick(ev, t) {
                const ctx = this.ctx;
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, t);
                osc.frequency.exponentialRampToValueAtTime(42, t + 0.09);

                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(ev.velocity, t + 0.003);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

                osc.connect(g).connect(this.out);
                osc.start(t);
                osc.stop(t + 0.4);
                this._track(osc, t + 0.4);
            }

            snare(ev, t) {
                const ctx = this.ctx;

                const noise = ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;

                const nf = ctx.createBiquadFilter();
                nf.type = 'highpass';
                nf.frequency.value = 1800;

                const ng = ctx.createGain();
                ng.gain.setValueAtTime(ev.velocity * 0.75, t);
                ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

                noise.connect(nf).connect(ng).connect(this.out);
                noise.start(t);
                noise.stop(t + 0.25);

                const body = ctx.createOscillator();
                body.type = 'triangle';
                body.frequency.setValueAtTime(220, t);
                body.frequency.exponentialRampToValueAtTime(140, t + 0.1);

                const bg = ctx.createGain();
                bg.gain.setValueAtTime(ev.velocity * 0.45, t);
                bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);

                body.connect(bg).connect(this.out);
                body.start(t);
                body.stop(t + 0.16);

                this._track(noise, t + 0.3);
                this._track(body, t + 0.2);
            }

            hat(ev, t) {
                const ctx = this.ctx;
                const noise = ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;

                const f = ctx.createBiquadFilter();
                f.type = 'highpass';
                f.frequency.value = 8000;

                const g = ctx.createGain();
                g.gain.setValueAtTime(ev.velocity * 0.18, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);

                noise.connect(f).connect(g).connect(this.out);
                noise.start(t);
                noise.stop(t + 0.1);
                this._track(noise, t + 0.15);
            }

            bass(ev, t) {
                const ctx = this.ctx;
                const p = this.profile;
                const dur = ev.duration * this.secPerBeat;
                const endTime = t + dur + 0.2;

                const g = ctx.createGain();
                const peak = ev.velocity * 0.55;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(peak, t + 0.008);
                g.gain.setTargetAtTime(0.0001, t + dur * 0.4, 0.16);

                const lp = ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.Q.value = 4.5;
                const bright = p.bassBright || 500;
                lp.frequency.setValueAtTime(bright * 0.4, t);
                lp.frequency.exponentialRampToValueAtTime(bright * 2.2, t + 0.05);
                lp.frequency.exponentialRampToValueAtTime(bright, t + dur);
                lp.connect(g).connect(this.out);

                ev.notes.forEach(midi => {
                    const f = midiToFreq(midi);
                    const saw = ctx.createOscillator();
                    saw.type = 'sawtooth';
                    saw.frequency.value = f;
                    saw.connect(lp);
                    saw.start(t);
                    saw.stop(endTime);
                    this._track(saw, endTime);

                    const sub = ctx.createOscillator();
                    sub.type = 'sine';
                    sub.frequency.value = f / 2;
                    const sg = ctx.createGain();
                    sg.gain.value = 0.6;
                    sub.connect(sg).connect(lp);
                    sub.start(t);
                    sub.stop(endTime);
                    this._track(sub, endTime);
                });
            }

            pad(ev, t) {
                const ctx = this.ctx;
                const p = this.profile;
                const dur = ev.duration * this.secPerBeat;
                const attack = 0.18, release = 0.7;
                const endTime = t + dur + release + 0.2;

                const g = ctx.createGain();
                const peak = ev.velocity * 0.16;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(peak, t + attack);
                g.gain.setValueAtTime(peak * 0.75, t + dur * 0.5);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur + release);

                const lp = ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.frequency.value = p.padBright || 3500;
                lp.Q.value = 0.7;
                lp.connect(g).connect(this.out);

                ev.notes.forEach((midi, i) => {
                    const f = midiToFreq(midi);
                    [-9, 0, 9].forEach(detune => {
                        const osc = ctx.createOscillator();
                        osc.type = 'sawtooth';
                        osc.frequency.value = f;
                        osc.detune.value = detune + i * 2;
                        osc.connect(lp);
                        osc.start(t);
                        osc.stop(endTime);
                        this._track(osc, endTime);
                    });
                });
            }

            guitar(ev, t) {
                const ctx = this.ctx;
                const p = this.profile;
                const dur = ev.duration * this.secPerBeat;
                const decay = 0.7 + dur * 1.1;
                const endTime = t + decay + 0.15;

                const g = ctx.createGain();
                const peak = ev.velocity * 0.32;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(peak, t + 0.005);
                g.gain.exponentialRampToValueAtTime(0.0001, t + decay);

                const body = ctx.createBiquadFilter();
                body.type = 'peaking';
                body.frequency.value = 380;
                body.Q.value = 2;
                body.gain.value = 6;

                const lp = ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.Q.value = 1.8;
                lp.frequency.setValueAtTime(p.guitarBright || 8000, t);
                lp.frequency.exponentialRampToValueAtTime(p.guitarDark || 600, t + decay);
                lp.connect(body).connect(g).connect(this.out);

                ev.notes.forEach(midi => {
                    const f = midiToFreq(midi);
                    [0, 5].forEach(detune => {
                        const osc = ctx.createOscillator();
                        osc.type = 'sawtooth';
                        osc.frequency.value = f;
                        osc.detune.value = detune;
                        osc.connect(lp);
                        osc.start(t);
                        osc.stop(endTime);
                        this._track(osc, endTime);
                    });
                });
            }

            arp(ev, t) {
                const ctx = this.ctx;
                const dur = ev.duration * this.secPerBeat;
                const decay = 0.22 + dur * 0.7;
                const endTime = t + decay + 0.06;

                const g = ctx.createGain();
                const peak = ev.velocity * 0.28;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(peak, t + 0.004);
                g.gain.exponentialRampToValueAtTime(0.0001, t + decay);

                const lp = ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.Q.value = 1.4;
                lp.frequency.setValueAtTime(7000, t);
                lp.frequency.exponentialRampToValueAtTime(1800, t + decay);
                lp.connect(g).connect(this.out);

                ev.notes.forEach(midi => {
                    const osc = ctx.createOscillator();
                    osc.type = 'triangle';
                    osc.frequency.value = midiToFreq(midi);
                    osc.connect(lp);
                    osc.start(t);
                    osc.stop(endTime);
                    this._track(osc, endTime);
                });
            }

            synth(ev, t) {
                const ctx = this.ctx;
                const p = this.profile;
                const dur = ev.duration * this.secPerBeat;
                const attack = 0.025, release = 0.35;
                const endTime = t + dur + release + 0.1;

                const g = ctx.createGain();
                const peak = ev.velocity * 0.3;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(peak, t + attack);
                g.gain.setValueAtTime(peak * 0.82, t + dur * 0.55);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur + release);

                const lp = ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.Q.value = 3;
                lp.frequency.setValueAtTime(500, t);
                lp.frequency.exponentialRampToValueAtTime(p.synthBright || 4000, t + 0.09);
                lp.frequency.exponentialRampToValueAtTime(p.synthDark || 1400, t + dur + release);
                lp.connect(g).connect(this.out);

                ev.notes.forEach(midi => {
                    const f = midiToFreq(midi);
                    [-7, 7].forEach(detune => {
                        const osc = ctx.createOscillator();
                        osc.type = 'sawtooth';
                        osc.frequency.value = f;
                        osc.detune.value = detune;
                        osc.connect(lp);
                        osc.start(t);
                        osc.stop(endTime);
                        this._track(osc, endTime);
                    });
                });
            }

            fadeOutAndStop(dur) {
                if (!this.running) return;
                const now = this.ctx.currentTime;
                const g = this.out.gain;
                g.cancelScheduledValues(now);
                g.setValueAtTime(Math.max(0.0001, g.value), now);
                g.exponentialRampToValueAtTime(0.0001, now + dur);
                this.running = false;
                const myTimer = this.timer;
                this.timer = null;
                setTimeout(() => {
                    if (myTimer) clearInterval(myTimer);
                    for (const src of this.sources) {
                        try { src.stop(); } catch (e) {}
                    }
                    this.sources.clear();
                    try { this.out.disconnect(); } catch (e) {}
                }, dur * 1000 + 150);
            }
        }

        /* ────────────────────────────────────────────────────────────────
           MusicManager
           ──────────────────────────────────────────────────────────────── */
        class MusicManager {
            constructor() {
                this.ctx = null;
                this.master = null;
                this.voiceGain = null;
                this.current = null;
                this.currentSeed = null;
                this.volume = 0.45;   // quieter than before
                this.ducked = false;
            }

            ensureContext() {
                if (this.ctx) {
                    if (this.ctx.state === 'suspended') {
                        try { this.ctx.resume(); } catch (e) {}
                    }
                    return this.ctx;
                }
                const Ctor = window.AudioContext || window.webkitAudioContext;
                if (!Ctor) return null;
                this.ctx = new Ctor();

                this.voiceGain = this.ctx.createGain();
                this.voiceGain.gain.value = 1;

                this.master = this.ctx.createGain();
                this.master.gain.value = this.volume;

                const comp = this.ctx.createDynamicsCompressor();
                comp.threshold.value = -12;
                comp.knee.value = 22;
                comp.ratio.value = 6;
                comp.attack.value = 0.004;
                comp.release.value = 0.18;

                this.voiceGain.connect(this.master);
                this.master.connect(comp);
                comp.connect(this.ctx.destination);
                return this.ctx;
            }

            play(seed) {
                if (seed === this.currentSeed && this.current) return;
                const ctx = this.ensureContext();
                if (!ctx) return;

                const old = this.current;
                const song = generateSong(seed);
                const player = new LoopPlayer(ctx, this.voiceGain, song);
                this.current = player;
                this.currentSeed = seed;

                if (old) old.fadeOutAndStop(0.5);
                player.start(ctx.currentTime + 0.02, 0.9);
            }

            duck(on) {
                if (!this.voiceGain || !this.ctx) return;
                if (this.ducked === !!on) return;
                this.ducked = !!on;
                const now = this.ctx.currentTime;
                const target = on ? 0.32 : 1;
                const tc = on ? 0.06 : 0.22;
                const g = this.voiceGain.gain;
                g.cancelScheduledValues(now);
                g.setValueAtTime(g.value, now);
                g.setTargetAtTime(target, now, tc);
            }

            pause() {
                if (this.ctx && this.ctx.state === 'running') {
                    try { this.ctx.suspend(); } catch (e) {}
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    try { this.ctx.resume(); } catch (e) {}
                }
            }

            setVolume(v) {
                this.volume = Math.max(0, Math.min(1, v));
                if (this.master && this.ctx) {
                    const now = this.ctx.currentTime;
                    this.master.gain.cancelScheduledValues(now);
                    this.master.gain.setTargetAtTime(this.volume, now, 0.05);
                }
            }
        }

        return new MusicManager();
    })();
</script>

        function hashString(s) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function storySeed(index) {

        function speakText(text, lang) {
            ChillSpaceMusic.duck(true);

            if (window.AndroidTTS && typeof window.AndroidTTS.speak === 'function') {
                window.AndroidTTS.speak(text, lang || 'en');
                return;
            }
            if (!window.speechSynthesis) {
                ChillSpaceMusic.duck(false);
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.92;
            utterance.pitch = 1.0;
            utterance.volume = 0.9;
            if (lang === 'ko') utterance.lang = 'ko-KR';
            else utterance.lang = 'en-US';
            const voices = speechSynthesis.getVoices();
            let voice = null;
            if (lang === 'ko') {
                voice = voices.find(v => v.lang.startsWith('ko'));
            } else {
                voice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel'))) || voices.find(v => v.lang.startsWith('en'));
            }
            if (voice) utterance.voice = voice;
            utterance.onend = () => {
                ChillSpaceMusic.duck(false);
                if (window.onTTSDone) window.onTTSDone();
            };
            utterance.onerror = () => {
                ChillSpaceMusic.duck(false);
            };
            speechSynthesis.speak(utterance);
        }

        function getTopics() { return currentLang === 'ko' ? koTopics : enTopics; }
        function getRelations() { return currentLang === 'ko' ? koRelations : enRelations; }
        function getTemplates() { return currentLang === 'ko' ? koTemplates : enTemplates; }

        let allStories = [];

        function generateStories(count) {
            const topics = getTopics();
            const relations = getRelations();
            const templates = getTemplates();
            const stories = [];
            const usedCombos = new Set();
            while (stories.length < count) {
                const tpl = templates[Math.floor(Math.random() * templates.length)];
                const topic = topics[Math.floor(Math.random() * topics.length)];
                const rel = relations[Math.floor(Math.random() * relations.length)];
                const key = `${tpl}|||${topic}|||${rel}`;
                if (!usedCombos.has(key)) {
                    usedCombos.add(key);
                    let htmlText = tpl.replace(/\$\{topic\}/g, topic).replace(/\$\{rel\}/g, rel);
                    let plainText = htmlText.replace(/<[^>]*>/g, '');
                    if (currentLang === 'en') {
                        htmlText = replaceWordsInHtml(htmlText);
                        plainText = replaceWordsInText(plainText);
                    }
                    stories.push({ topic, rel, htmlText, plainText, id: stories.length + 1 });
                }
            }
            for (let i = stories.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [stories[i], stories[j]] = [stories[j], stories[i]];
            }
            stories.forEach((s, idx) => { s.id = idx + 1; });
            return stories;
        }

        function rebuildStories() {
            allStories = generateStories(130);
        }

        function buildSlides() {
            scrollContainer.innerHTML = '';
            const fragment = document.createDocumentFragment();
            allStories.forEach((story, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.dataset.storyId = story.id;
                slide.dataset.index = index;
                const likeCount = Math.floor(Math.random() * 95000) + 1200;
                const commentCount = Math.floor(Math.random() * 8000) + 80;
                const shareCount = Math.floor(Math.random() * 15000) + 200;
                slide.innerHTML = `
                            <div class="story-card">
                                <div class="story-text">${story.htmlText}</div>
                                <div class="story-buttons">
                                    <button class="show-more-btn">${currentLang === 'ko' ? '더 보기' : 'Show more'}</button>
                                    <button class="hide-btn">${currentLang === 'ko' ? '숨기기' : 'Hide'}</button>
                                </div>
                            </div>
                            <button class="restore-story-btn">👁 ${currentLang === 'ko' ? '이야기 보기' : 'Show story'}</button>
                            <div class="side-actions">
                                <button class="side-action like-btn" data-index="${index}"><span class="icon-circle">❤️</span><span class="action-label like-count">${formatCount(likeCount)}</span></button>
                                <button class="side-action comment-btn" data-index="${index}"><span class="icon-circle">💬</span><span class="action-label">${formatCount(commentCount)}</span></button>
                                <button class="side-action"><span class="icon-circle">↗️</span><span class="action-label">${formatCount(shareCount)}</span></button>
                                <button class="side-action bookmark-btn" data-index="${index}"><span class="icon-circle">🔖</span><span class="action-label">${currentLang === 'ko' ? '저장' : 'Save'}</span></button>
                            </div>
                        `;
                fragment.appendChild(slide);
            });
            scrollContainer.appendChild(fragment);
            setupIntersectionObserver();
            activeIndex = 0;
            scrollContainer.scrollTop = 0;
        }

        function formatCount(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function generateComments(topic, rel) {
            const templates = [
                `<span class="user">user_${Math.floor(Math.random()*9999)}</span> ${rel} was definitely a great person`,
                `<span class="user">anon_${Math.floor(Math.random()*999)}</span> Thanks for reminding me how much I love ${topic}`,
                `<span class="user">storylover</span> I can't believe ${rel} said that about ${topic}`,
                `<span class="user">reddit_refugee</span> This is exactly why ${topic} matters so much`,
                `<span class="user">just_lurking</span> ${rel} and ${topic} – name a more iconic duo`,
                `<span class="user">deep_thinker</span> The way ${rel} talked about ${topic} changed my perspective`,
                `<span class="user">random_user</span> I need more stories about ${topic} and ${rel}`
            ];
            const comments = [];
            for (let i = 0; i < 5; i++) {
                comments.push(templates[Math.floor(Math.random() * templates.length)]);
            }
            return comments;
        }

        function showComments(index) {
            const story = allStories[index];
            if (!story) return;
            const comments = generateComments(story.topic, story.rel);
            commentList.innerHTML = comments.map(c => `<div class="comment">${c}</div>`).join('');
            commentOverlay.classList.add('show');
        }

        let observer = null;
        let activeIndex = 0;

        function setupIntersectionObserver() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                let maxRatio = 0, mostVisible = activeIndex;
                entries.forEach(e => {
                    if (e.isIntersecting && e.intersectionRatio > maxRatio) {
                        maxRatio = e.intersectionRatio;
                        const idx = parseInt(e.target.dataset.index);
                        if (!isNaN(idx)) mostVisible = idx;
                    }
                });
                if (mostVisible !== activeIndex && maxRatio > 0.5) {
                    const prev = activeIndex;
                    activeIndex = mostVisible;
                    onSlideChange(prev, activeIndex);
                }
            }, { root: scrollContainer, threshold: [0.3, 0.5, 0.6, 0.7, 0.8, 0.9] });
            document.querySelectorAll('.slide').forEach(s => observer.observe(s));
        }

        let currentTTSIndex = -1;
        let autoTTSTimeout = null;

        function onSlideChange(prev, curr) {
            stopTTS();
            bg.setScene(pickRandomGame());
            ChillSpaceMusic.play(storySeed(curr));
            showMusicIndicator();
            if (audioInitialized) {
                if (autoTTSTimeout) clearTimeout(autoTTSTimeout);
                autoTTSTimeout = setTimeout(() => {
                    if (activeIndex === curr && currentTTSIndex === -1) speakStory(curr);
                }, 400);
            }
        }

        function showMusicIndicator() {
            musicIndicator.classList.add('show');
            clearTimeout(musicIndicator._timeout);
            musicIndicator._timeout = setTimeout(() => musicIndicator.classList.remove('show'), 1500);
        }

        function stopTTS() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            ChillSpaceMusic.duck(false);
            currentTTSIndex = -1;
        }

        function speakStory(index) {
            if (!audioInitialized) return;
            const story = allStories[index];
            if (!story) return;
            if (currentTTSIndex === index && (window.speechSynthesis?.speaking)) {
                stopTTS();
                return;
            }
            stopTTS();
            speakText(story.plainText, currentLang);
            currentTTSIndex = index;
        }

        let audioInitialized = false;

        function startAudioAndTTS() {
            if (audioInitialized) return;
            audioInitialized = true;
            ChillSpaceMusic.play(storySeed(activeIndex));
            speakStory(activeIndex);
        }

        const likedStories = new Set();
        const bookmarkedStories = new Set();

        function toggleLike(index, btn) {
            const key = `story-${index}`;
            const label = btn.querySelector('.like-count');
            if (likedStories.has(key)) {
                likedStories.delete(key);
                btn.classList.remove('liked');
                label.textContent = formatCount(Math.max(0, parseCount(label.textContent) - 1));
            } else {
                likedStories.add(key);
                btn.classList.add('liked');
                label.textContent = formatCount(parseCount(label.textContent) + 1);
                spawnHeartBurst(btn);
            }
        }

        function parseCount(s) { if (s.endsWith('M')) return parseFloat(s) * 1000000; if (s.endsWith('K')) return parseFloat(s) * 1000; return parseInt(s) || 0; }

        function spawnHeartBurst(el) {
            const rect = el.getBoundingClientRect();
            const heart = document.createElement('div');
            heart.className = 'heart-burst';
            heart.textContent = '❤️';
            heart.style.left = rect.left + rect.width / 2 - 20 + 'px';
            heart.style.top = rect.top + 'px';
            document.body.appendChild(heart);
            heart.addEventListener('animationend', () => heart.remove());
        }

        function toggleBookmark(index, btn) {
            const key = `story-${index}`;
            const icon = btn.querySelector('.icon-circle');
            if (bookmarkedStories.has(key)) { bookmarkedStories.delete(key); icon.textContent = '🔖'; }
            else { bookmarkedStories.add(key); icon.textContent = '📌'; }
        }

        function setupEvents() {
            scrollContainer.addEventListener('click', (e) => {
                const likeBtn = e.target.closest('.like-btn');
                if (likeBtn) { e.preventDefault();
                    const idx = parseInt(likeBtn.dataset.index); if (!isNaN(idx)) toggleLike(idx, likeBtn); return; }
                const bookmarkBtn = e.target.closest('.bookmark-btn');
                if (bookmarkBtn) { e.preventDefault();
                    const idx = parseInt(bookmarkBtn.dataset.index); if (!isNaN(idx)) toggleBookmark(idx, bookmarkBtn); return; }
                const commentBtn = e.target.closest('.comment-btn');
                if (commentBtn) { e.preventDefault();
                    const idx = parseInt(commentBtn.dataset.index); if (!isNaN(idx)) showComments(idx); return; }

                const hideBtn = e.target.closest('.hide-btn');
                if (hideBtn) {
                    e.preventDefault();
                    const slide = hideBtn.closest('.slide');
                    if (slide) {
                        const card = slide.querySelector('.story-card');
                        if (card) card.classList.add('hidden');
                        slide.classList.add('story-hidden');
                    }
                    return;
                }

                const restoreBtn = e.target.closest('.restore-story-btn');
                if (restoreBtn) {
                    e.preventDefault();
                    const slide = restoreBtn.closest('.slide');
                    if (slide) {
                        const card = slide.querySelector('.story-card');
                        if (card) card.classList.remove('hidden');
                        slide.classList.remove('story-hidden');
                    }
                    return;
                }

                const showMoreBtn = e.target.closest('.show-more-btn');
                if (showMoreBtn) {
                    const storyText = showMoreBtn.parentElement.parentElement.querySelector('.story-text');
                    if (!storyText) return;
                    storyText.classList.toggle('expanded');
                    showMoreBtn.textContent = storyText.classList.contains('expanded') ? (currentLang === 'ko' ? '간략히' : 'Show less') : (currentLang === 'ko' ? '더 보기' : 'Show more');
                }
            });
            scrollContainer.addEventListener('dblclick', (e) => {
                const slide = e.target.closest('.slide');
                if (slide) { const idx = parseInt(slide.dataset.index);
                    const likeBtn = slide.querySelector('.like-btn'); if (!isNaN(idx) && likeBtn && !likedStories.has(`story-${idx}`)) toggleLike(idx, likeBtn); }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); scrollToSlide(activeIndex + 1); }
                else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); scrollToSlide(activeIndex - 1); }
                else if (e.key === 'l') { e.preventDefault();
                    const slide = document.querySelector(`.slide[data-index="${activeIndex}"]`); if (slide) {
                        const lb = slide.querySelector('.like-btn'); if (lb && !likedStories.has(`story-${activeIndex}`)) toggleLike(activeIndex, lb); } }
            });
        }

        function scrollToSlide(index) {
            const clamped = Math.max(0, Math.min(index, allStories.length - 1));
            const slide = document.querySelector(`.slide[data-index="${clamped}"]`);
            if (slide) slide.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            if (lang === 'ko') {
                badgeText.textContent = '📖 무한 이야기';
                langToggle.textContent = 'English';
                autoscrollToggle.textContent = `자동 스크롤: ${isAutoscrollEnabled ? '켜기' : '끄기'}`;
                startSub.textContent = '탭하여 경험을 시작하세요';
                document.querySelector('#header .logo .ko').textContent = '릴스페이스';
                document.querySelector('#loadReelSpaceBtn').textContent = '릴스페이스 시작';
            } else {
                badgeText.textContent = '📖 Infinite Stories';
                langToggle.textContent = '한국어';
                autoscrollToggle.textContent = `Autoscroll: ${isAutoscrollEnabled ? 'On' : 'Off'}`;
                startSub.textContent = 'tap to start the experience';
                document.querySelector('#header .logo .ko').textContent = '릴스페이스';
                document.querySelector('#loadReelSpaceBtn').textContent = 'Load ReelSpace';
            }
            rebuildStories();
            buildSlides();
            activeIndex = 0;
            if (audioInitialized) speakStory(0);
        }

        loadReelSpaceBtn.addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            startOverlay.classList.add('hidden-display');
            startAudioAndTTS();
        });

        langToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            switchLanguage(currentLang === 'en' ? 'ko' : 'en');
        });

        autoscrollToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            isAutoscrollEnabled = !isAutoscrollEnabled;
            autoscrollToggle.classList.toggle('active', isAutoscrollEnabled);
            const offText = currentLang === 'ko' ? '끄기' : 'Off';
            const onText = currentLang === 'ko' ? '켜기' : 'On';
            const label = currentLang === 'ko' ? '자동 스크롤' : 'Autoscroll';
            autoscrollToggle.textContent = `${label}: ${isAutoscrollEnabled ? onText : offText}`;
        });

        document.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && !startOverlay.classList.contains('hidden')) {
                e.preventDefault();
                loadReelSpaceBtn.click();
            }
        });

        closeCommentsBtn.addEventListener('click', () => {
            commentOverlay.classList.remove('show');
        });

        function init() {
            rebuildStories();
            buildSlides();
            setupEvents();
            if (window.speechSynthesis) {
                speechSynthesis.getVoices();
                speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
            }
            console.log('🚀 ReelSpace ready – click "Load ReelSpace" to begin.');
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
</script>
</body>
</html>
