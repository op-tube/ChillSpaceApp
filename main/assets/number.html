    }

    function updateChatOnlineCount() {
        const el = document.getElementById('chatOnlineCount');
        if (el) {
            const count = 1 + bots.length;
            el.textContent = '● ' + count + ' online';
        }
    }

    // ==================== BUTTON MODE CHECK ====================
    function updateButtonModeCheck() {
        if (!isGameStarted) return;
        const total = getTotalCount();
        if (total < 1000) return;

        const botsAhead = !getLeader();
        const probability = botsAhead ? 1 / 100 : 1 / 400;

        if (buttonMode === 'plus1' && Math.random() < probability) {
            buttonMode = 'plus100';
            const btn = document.getElementById('plusBtn');
            btn.dataset.mode = 'plus100';
            updatePlusButtonText();
            if (buttonModeResetTimeout) clearTimeout(buttonModeResetTimeout);
            buttonModeResetTimeout = setTimeout(() => {
                if (buttonMode === 'plus100') {
                    buttonMode = 'plus1';
                    const btn2 = document.getElementById('plusBtn');
                    btn2.dataset.mode = 'plus1';
                    updatePlusButtonText();
                }
            }, 3000);
        }
    }

    function getLeader() {
        let all = [player, ...bots].sort((a, b) => b.score - a.score);
        return all[0] === player;
    }

    // ==================== DOPAMINE SPIKE ====================
    function scheduleDopamineSpike() {
        if (dopamineSpikeTimeout) clearTimeout(dopamineSpikeTimeout);
        const delay = 180000 + Math.random() * 120000;
        dopamineSpikeTimeout = setTimeout(() => {
            triggerDopamineSpike();
        }, delay);
    }

    function triggerDopamineSpike() {
        if (!isGameStarted) return;
        const pct = 30 + Math.floor(Math.random() * 171);
        dopamineSpikeActive = true;
        dopamineSpikeEndTime = Date.now() + 15000;

        const toast = document.getElementById('dopamineToast');
        toast.textContent = `⚡ ${t('dopamineSpike')} ${pct}%! ${t('doubleNumbers')}`;
        toast.style.display = 'block';
        dopamineToastVisible = true;
        updatePlusButtonText();

        safeVibrate([50, 30, 50, 30, 100]);

        setTimeout(() => {
            dopamineSpikeActive = false;
            toast.style.display = 'none';
            dopamineToastVisible = false;
            updatePlusButtonText();
            scheduleDopamineSpike();
        }, 15000);
    }

    // ==================== DAILY CHALLENGE ====================
    function updateDailyChallenge() {
        const stored = localStorage.getItem('chillspace_daily_challenge');
        if (!stored) return;
        let challenge;
        try { challenge = JSON.parse(stored); } catch (e) { return; }
        if (challenge.type !== 'do_numbers') return;
        const newProgress = Math.min(challenge.progress + 1, challenge.target);
        if (newProgress === challenge.progress) return;
        challenge.progress = newProgress;
        localStorage.setItem('chillspace_daily_challenge', JSON.stringify(challenge));
        window.dispatchEvent(new StorageEvent('storage', {
            key: 'chillspace_daily_challenge',
            oldValue: stored,
            newValue: JSON.stringify(challenge),
            url: window.location.href,
            storageArea: localStorage
        }));
    }

    // ==================== CORE ACTIONS ====================
    function addOne() {
        const amount = dopamineSpikeActive ? 2 : 1;
        const isPlus100 = buttonMode === 'plus100';
        const actualAmount = isPlus100 ? (dopamineSpikeActive ? 200 : 100) : amount;

        player.score += actualAmount;
        player.sessionScore += actualAmount;

        if (currentMode === 'chat') {
            const totalAfterPlayer = getTotalCount();
            addChatMessage('user', player.name, totalAfterPlayer, '');
        }

        const reactingBots = [];
        bots.forEach(b => {
            if (Math.random() < 0.33) {
                const botAdd = Math.floor(Math.random() * 2) + 1;
                b.score += botAdd;
                reactingBots.push(b);
            }
        });

        if (currentMode === 'chat' && reactingBots.length > 0) {
            const shuffled = reactingBots.sort(() => Math.random() - 0.5);
            const finalTotal = getTotalCount();
            shuffled.forEach(bot => {
                addChatMessage('bot', bot.name, finalTotal, bot.name);
            });
        }

        safeVibrate(isPlus100 ? 80 : 40);
        checkMilestone();

        if (buttonMode === 'plus100') {
            buttonMode = 'plus1';
            const btn = document.getElementById('plusBtn');
            btn.dataset.mode = 'plus1';
            if (buttonModeResetTimeout) clearTimeout(buttonModeResetTimeout);
            updatePlusButtonText();
        }

        totalCount = getTotalCount();
        save();
        updateUI();
        updateDailyChallenge();
        checkModeUnlock();
    }

    function addOneChat() {
        addOne();
        updatePlusButtonText();
    }

    function checkMilestone() {
        const currentIndex = Math.floor(player.score / 100);
        if (currentIndex > lastMilestoneIndex && currentIndex >= 1) {
            const milestone = currentIndex * 100;
            lastMilestoneIndex = currentIndex;

            const dopToast = document.getElementById('dopamineToast');
            if (dopamineToastVisible) {
                dopToast.style.display = 'none';
            }

            const toast = document.getElementById('milestoneToast');
            toast.textContent = `${t('congrats')} ${milestone} ${t('milestoneSuffix')}`;
            toast.style.display = 'block';
            milestoneVisible = true;

            safeVibrate([200, 100, 200, 100, 400]);

            setTimeout(() => {
                toast.style.display = 'none';
                milestoneVisible = false;
                if (dopamineSpikeActive && dopamineToastVisible) {
                    document.getElementById('dopamineToast').style.display = 'block';
                }
            }, 2500);
        }
    }

    function botTick() {
        if (!isGameStarted) return;
        const sendingBots = [];
        bots.forEach(b => {
            if (Math.random() < 0.25) {
                const add = Math.floor(Math.random() * 3) + 1;
                b.score += add;
                sendingBots.push({ bot: b, add: add });
            }
        });
        if (sendingBots.length > 0 && currentMode === 'chat') {
            const shuffled = sendingBots.sort(() => Math.random() - 0.5);
            shuffled.forEach(({ bot, add }) => {
                const total = getTotalCount();
                addChatMessage('bot', bot.name, total, bot.name);
            });
        }
        totalCount = getTotalCount();
        save();
        updateUI();
        checkModeUnlock();
    }

    function updateUI() {
        const total = getTotalCount();
        document.getElementById('totalStat').textContent = `${t('total')}: ${total}`;
        document.getElementById('totalStat').dataset.rawTotal = total;
        document.getElementById('yourTotalStat').textContent = `${t('yourTotal')}: ${player.score}`;
        document.getElementById('yourTotalStat').dataset.rawYour = player.score;
        document.getElementById('thisGameStat').textContent = `${t('thisGame')}: ${player.sessionScore}`;
        document.getElementById('thisGameStat').dataset.rawThis = player.sessionScore;
        updateLeaderboard();
        updateModeToggleButton();
        updateCalcYourTotal();
    }

    function updateLeaderboard() {
        let all = [player, ...bots].sort((a, b) => b.score - a.score);
        const maxScore = all[0].score || 1;
        const lb = document.getElementById('leaderboard');
        lb.innerHTML = `<h3 style="text-align:center; margin-bottom:8px; font-size:1.05rem; letter-spacing:0.5px;">${t('liveRankings')}</h3>`;

        all.slice(0, 6).forEach(p => {
            const width = Math.max((p.score / maxScore) * 100, 2);
            const barRow = document.createElement('div');
            barRow.className = 'bar-row';
            const isPlayer = p === player;
            barRow.innerHTML = `
                <div class="bar-label">
                    <span style="${isPlayer ? 'color:#00ff00; text-shadow:0 0 8px #00ff00;' : ''}">${isPlayer ? '⭐ ' : ''}${p.name}</span>
                    <span>${p.score}</span>
                </div>
                <div class="bar ${isPlayer ? 'you' : 'bot'}" style="width: ${width}%"></div>
            `;
            lb.appendChild(barRow);
        });
    }

    // ==================== MUSIC ====================
    function toggleMusic() {
        musicOn = !musicOn;
        const btn = document.getElementById('musicBtn');
        if (musicOn) {
            ChillSpaceMusic.play();
            btn.classList.add('playing');
            btn.textContent = t('pauseMusic');
        } else {
            ChillSpaceMusic.pause();
            btn.classList.remove('playing');
            btn.textContent = t('playMusic');
        }
    }

    // ==================== CALCULATOR MODE ====================
    let calcExpression = '';
    let calcPreviousMode = 'original';
    let calcToastTimeout = null;

    function toggleCalculatorMode() {
        if (currentMode === 'calculator') {
            switchFromCalculatorMode();
        } else {
            switchToCalculatorMode();
        }
    }

    function switchToCalculatorMode() {
        if (currentMode === 'calculator') return;
        calcPreviousMode = (currentMode === 'chat') ? 'chat' : 'original';
        currentMode = 'calculator';

        document.body.classList.remove('mode-chat', 'mode-original');
        document.body.classList.add('mode-calculator');
        document.getElementById('calculatorModeContainer').style.display = 'flex';
        document.getElementById('chatModeContainer').style.display = 'none';

        calcClear();
        updateCalcButton();
        updateCalcTexts();
        updateCalcYourTotal();
    }

    function switchFromCalculatorMode() {
        if (currentMode !== 'calculator') return;
        document.body.classList.remove('mode-calculator');
        document.getElementById('calculatorModeContainer').style.display = 'none';

        if (calcPreviousMode === 'chat' && getTotalCount() >= 1000) {
            switchToChatMode();
        } else {
            switchToOriginalMode();
        }
        updateCalcButton();
    }

    function updateCalcButton() {
        const btn = document.getElementById('calcToggleBtn');
        if (!btn) return;
        if (currentMode === 'calculator') {
            btn.textContent = '🎮 ' + t('backToGame');
            btn.classList.add('active-calc');
        } else {
            btn.textContent = t('calculatorMode');
            btn.classList.remove('active-calc');
        }
    }

    function updateCalcTexts() {
        const title = document.getElementById('calcTitle');
        if (title) title.textContent = t('calculatorMode');
        const quick = document.getElementById('calcQuickAdd');
        if (quick) quick.placeholder = t('calcQuickPlaceholder');
        const addBtn = document.getElementById('calcQuickAddBtn');
        if (addBtn) addBtn.textContent = t('calcAdd');
        const backBtn = document.getElementById('calcBackBtn');
        if (backBtn) backBtn.textContent = '← ' + t('backToGame');
        const undoBtn = document.getElementById('calcUndoBtn');
        if (undoBtn) undoBtn.title = t('calcUndone');
        updateCalcYourTotal();
    }

    // Live "Your total" readout in the calculator header
    function updateCalcYourTotal() {
        const el = document.getElementById('calcYourTotal');
        if (el) el.textContent = t('yourTotal') + ': ' + player.score;
    }

    // ==================== RESET ALL SCORES ====================
    // Wipes player, bots, session, and calculator-added points, and resets
    // the milestone tracker so celebration pop-ups fire again from 100 upward.
    function resetAllScores() {
        player.score = 0;
        player.sessionScore = 0;
        player.calcAdded = 0;
        bots.forEach(b => b.score = 0);

        // Reset milestone tracker so we get celebrations at 100, 200, 300…
        lastMilestoneIndex = 0;

        // Reset button-mode back to +1 in case it was stuck on +100
        buttonMode = 'plus1';
        const plusBtn = document.getElementById('plusBtn');
        if (plusBtn) plusBtn.dataset.mode = 'plus1';
        if (buttonModeResetTimeout) clearTimeout(buttonModeResetTimeout);
        updatePlusButtonText();

        totalCount = getTotalCount();
        save();
        updateUI();
        updateLeaderboard();
        checkModeUnlock();

        // Clear any pending calculator expression
        calcClear();

        // Green pill toast — same visual style as calculator additions
        showCalcToast(t('resetDone'));
        safeVibrate([100, 60, 100]);
    }

    function calcClear() {
        calcExpression = '';
        updateCalcDisplay();
        setCalcResult('');
    }

    function calcBackspace() {
        calcExpression = calcExpression.slice(0, -1);
        updateCalcDisplay();
    }

    function calcPress(val) {
        if (calcExpression.length >= 32) return;
        const operators = ['+', '-', '×', '÷'];
        const lastChar = calcExpression.slice(-1);

        if (operators.includes(val)) {
            if (calcExpression === '' && val !== '-') return;
            if (operators.includes(lastChar)) {
                calcExpression = calcExpression.slice(0, -1) + val;
            } else {
                calcExpression += val;
            }
        } else if (val === '.') {
            const parts = calcExpression.split(/[+\-×÷()]/);
            const currentNum = parts[parts.length - 1];
            if (currentNum.includes('.')) return;
            if (currentNum === '') {
                calcExpression += '0.';
            } else {
                calcExpression += '.';
            }
        } else if (val === '(') {
            if (calcExpression === '' || operators.includes(lastChar) || lastChar === '(') {
                calcExpression += val;
            }
        } else if (val === ')') {
            const opens = (calcExpression.match(/\(/g) || []).length;
            const closes = (calcExpression.match(/\)/g) || []).length;
            if (opens > closes && !operators.includes(lastChar) && lastChar !== '(') {
                calcExpression += val;
            }
        } else {
            calcExpression += val;
        }
        updateCalcDisplay();
    }

    function updateCalcDisplay() {
        const el = document.getElementById('calcDisplay');
        if (el) el.textContent = calcExpression || '0';
    }

    function setCalcResult(text, isError) {
        const el = document.getElementById('calcResult');
        if (!el) return;
        el.textContent = text || '';
        el.classList.toggle('error', !!isError);
    }

    function calcEvaluate() {
        if (!calcExpression.trim()) return;

        let expr = calcExpression.replace(/×/g, '*').replace(/÷/g, '/');

        if (!/^[0-9+\-*/().\s]+$/.test(expr)) {
            setCalcResult(t('calcInvalid'), true);
            return;
        }

        let depth = 0;
        for (const c of expr) {
            if (c === '(') depth++;
            else if (c === ')') depth--;
            if (depth < 0) { setCalcResult(t('calcUnbalanced'), true); return; }
        }
        if (depth !== 0) { setCalcResult(t('calcUnbalanced'), true); return; }

        let raw;
        try {
            raw = Function('"use strict"; return (' + expr + ')')();
        } catch (e) {
            setCalcResult(t('calcInvalid'), true);
            return;
        }

        if (typeof raw !== 'number' || !Number.isFinite(raw)) {
            setCalcResult(t('calcInvalid'), true);
            return;
        }

        const rounded = Math.round(raw);
        if (rounded === 0) {
            setCalcResult(t('calcZero'), false);
            return;
        }

        applyCalcScore(rounded);

        calcExpression = String(rounded);
        updateCalcDisplay();
    }

    function calcQuickAdd() {
        const input = document.getElementById('calcQuickAdd');
        if (!input) return;
        const val = parseFloat(input.value);
        if (!Number.isFinite(val) || val === 0) {
            setCalcResult(t('calcEnterNumber'), true);
            return;
        }
        applyCalcScore(Math.round(val));
        input.value = '';
    }

    function applyCalcScore(amount) {
        const before = player.score;
        player.score = Math.max(0, player.score + amount);
        player.sessionScore += amount;
        const actualAdded = player.score - before;

        // Track net contribution from Calculator Mode so it can be undone.
        player.calcAdded = Math.max(0, player.calcAdded + actualAdded);

        const sign = actualAdded >= 0 ? '+' : '';
        const msg = sign + actualAdded + ' ' + t('calcAdded');
        setCalcResult(msg, false);
        showCalcToast(sign + actualAdded + ' ' + t('calcAdded'));

        safeVibrate(actualAdded >= 0 ? 60 : [80, 40, 80]);

        totalCount = getTotalCount();
        save();
        updateUI();
        checkMilestone();
        checkModeUnlock();
    }

    // ==================== CALCULATOR UNDO (Minus button) ====================
    // Removes ALL score gained through Calculator Mode, keeping genuine score
    // (clicks, dopamine spike bonuses, and any bot points) untouched.
    function calcUndoAll() {
        if (player.calcAdded <= 0) {
            setCalcResult(t('calcNothingToUndo'), false);
            showCalcToast(t('calcNothingToUndo'));
            return;
        }

        const undoAmount = player.calcAdded;
        player.score = Math.max(0, player.score - undoAmount);
        player.sessionScore = Math.max(0, player.sessionScore - undoAmount);
        player.calcAdded = 0;

        const msg = '−' + undoAmount + ' ' + t('calcUndone');
        setCalcResult(msg, false);
        showCalcToast(msg);

        safeVibrate([80, 40, 80]);

        totalCount = getTotalCount();
        save();
        updateUI();
        checkModeUnlock();
    }

    function showCalcToast(text) {
        const toast = document.getElementById('calcToast');
        if (!toast) return;
        toast.textContent = text;
        toast.style.display = 'block';
        toast.style.animation = 'none';
        void toast.offsetWidth;
        toast.style.animation = 'calcToastPop 1.2s ease forwards';
        if (calcToastTimeout) clearTimeout(calcToastTimeout);
        calcToastTimeout = setTimeout(() => {
            toast.style.display = 'none';
        }, 1250);
    }

    // ==================== INIT ====================
    function init() {
        const savedData = JSON.parse(localStorage.getItem('numberGameV10') || '{}');
        const chillName = localStorage.getItem('chillspace_display_name');

        if (chillName) {
            document.getElementById('nameInput').value = chillName;
            startGame();
        } else if (savedData.name) {
            document.getElementById('nameInput').value = savedData.name;
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === currentLang);
        });

        const savedMode = localStorage.getItem('numberGameMode') || 'original';
        currentMode = savedMode;

        updateUITexts();
        document.getElementById('chatModeContainer').style.display = 'none';
        document.getElementById('calculatorModeContainer').style.display = 'none';
        document.body.classList.add('mode-original');
        const btn = document.getElementById('modeToggleBtn');
        btn.style.display = 'none';
        const chatInput = document.getElementById('chatInput');
        if (chatInput) {
            chatInput.addEventListener('focus', function() { this.blur(); });
            chatInput.addEventListener('click', function() { this.blur(); });
            chatInput.addEventListener('touchstart', function() { this.blur(); });
        }
        setInterval(() => {
            if (isGameStarted) {
                checkModeUnlock();
            }
        }, 2000);
    }

    // Override startGame to apply saved mode
    const originalStartGame = startGame;
    startGame = function() {
        originalStartGame.call(this);
        if (currentMode === 'chat' && getTotalCount() >= 1000) {
            switchToChatMode();
        } else if (currentMode === 'chat' && getTotalCount() < 1000) {
            currentMode = 'original';
            localStorage.setItem('numberGameMode', 'original');
        }
    };

    const origSwitchToChat = switchToChatMode;
    switchToChatMode = function() {
        origSwitchToChat.call(this);
        localStorage.setItem('numberGameMode', 'chat');
    };

    const origSwitchToOriginal = switchToOriginalMode;
    switchToOriginalMode = function() {
        origSwitchToOriginal.call(this);
        localStorage.setItem('numberGameMode', 'original');
    };

    document.addEventListener('DOMContentLoaded', init);
    if (document.readyState !== 'loading') init();
</script>
