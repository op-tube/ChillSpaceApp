<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Game 2.0 – Group Chat Chaos</title>
    <meta description="The official clicker game from the placebo social media network! Click away your gaming habit with the ultimate dopamine hit!">
    <link rel="canonical" href="https://chillspace.ai/numbers/" />
    <script type="application/ld+json">

            "@context": "https://schema.org",

            "url": "https://chillspace.ai/numbers",
            "genre": ["Casual", "Clicker", "Multiplayer"],
            "inLanguage": ["en", "ko", "fr", "es"],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@type": "Organization", "name": "ChillSpace" },
            "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.9", "ratingCount": "1024" }

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Game",
            "name": "넘버 게임 2.0",
            "description": "중독성 있는 카운팅 게임! 실시간 순위, 도파민 스파이크, ChillSpace 친구 연동 기능이 있습니다. 친구들과 봇을 상대로 최고 점수에 도전하세요!",
            "url": "https://chillspace.ai/numbers",
            "genre": ["캐주얼", "클리커", "멀티플레이어"],
            "inLanguage": ["ko", "en", "fr", "es"],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@type": "Organization", "name": "ChillSpace" },
            "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.9", "ratingCount": "1024" }
        }
    </script>

    <style>
        /* ----- RESET & BASE ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 30px;
            color: white;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        body.mode-original { animation: bgColorFade 25s ease-in-out infinite; }
        body.mode-chat {
            background: #f0f2f5 !important;
            animation: none !important;
        }

        @keyframes bgColorFade {
            0% { background-color: #FFD700; }
            20% { background-color: #00FF00; }
            40% { background-color: #0088FF; }
            60% { background-color: #8800FF; }
            80% { background-color: #FF6600; }
            100% { background-color: #FFD700; }
        }

        /* ----- TOP BAR ----- */
        .top-bar {
            position: fixed;
            top: 10px;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 12px;
            padding: 0 15px;
            pointer-events: none;
        }
        .top-bar>* { pointer-events: auto; }

        .lang-selector {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .lang-btn.active {
            background: #ff00ff;
            border-color: #ff00ff;
            box-shadow: 0 0 12px #ff00ff;
            color: white;
        }
        .lang-btn:hover { transform: scale(1.05); }

        .mode-toggle-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #FFD700;
            color: #FFD700;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            backdrop-filter: blur(5px);
            transition: all 0.25s;
            letter-spacing: 0.3px;
            display: none;
        }
        .mode-toggle-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .mode-toggle-btn.active-chat {
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .btn-music {
            background: rgba(17, 17, 17, 0.7);
            border: 2px solid #00ff00;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            font-weight: 600;
        }
        .btn-music.playing {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 18px #00ff00;
        }

        /* ----- STATS ----- */
        .stats {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            padding: 14px 20px;
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            min-width: 260px;
            transition: all 0.3s;
            position: relative;
            z-index: 20;
            margin-top: 70px;
            margin-bottom: 12px;
        }
        body.mode-chat .stats {
            background: rgba(255, 255, 255, 0.85);
            border-color: #ddd;
            color: #222;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        body.mode-chat .stats .stat-green,
        body.mode-chat .stats .stat-magenta,
        body.mode-chat .stats .stat-gold { text-shadow: none; }
        body.mode-chat .stats .stat-green { color: #2e7d32; }
        body.mode-chat .stats .stat-magenta { color: #7b1fa2; }
        body.mode-chat .stats .stat-gold { color: #b8860b; }

        .stat-green {
            color: #00ff00;
            font-size: 2.2rem;
            font-weight: 800;
            text-shadow: 0 0 18px #00ff00, 0 0 35px rgba(0, 255, 0, 0.4);
            letter-spacing: 1px;
        }
        .stat-magenta {
            color: #ff00ff;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 0 10px #ff00ff;
            margin-top: 2px;
        }
        .stat-gold {
            color: #ffdd00;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 0 10px #ffdd00;
            margin-top: 2px;
        }

        /* ----- LEADERBOARD ----- */
        .leaderboard {
            width: 90%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ff00ff;
            border-radius: 14px;
            padding: 15px;
            margin-top: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.25);
            transition: all 0.3s;
            position: relative;
            z-index: 5;
        }
        body.mode-chat .leaderboard {
            background: rgba(255, 255, 255, 0.92);
            border-color: #7b1fa2;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
            color: #222;
        }
        body.mode-chat .leaderboard .bar-label { color: #222; }
        body.mode-chat .leaderboard .bar.you {
            background: #2e7d32;
            box-shadow: 0 0 8px rgba(46, 125, 50, 0.4);
        }
        body.mode-chat .leaderboard .bar.bot {
            background: #7b1fa2;
            box-shadow: 0 0 8px rgba(123, 31, 162, 0.3);
        }

        .bar-row { margin: 6px 0; }
        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 3px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: #eee;
        }
        .bar {
            height: 18px;
            border-radius: 10px;
            transition: width 0.5s ease;
            min-width: 4px;
        }
        .bar.you {
            background: #00ff00;
            box-shadow: 0 0 12px #00ff00;
        }
        .bar.bot {
            background: #a020f0;
            box-shadow: 0 0 8px rgba(160, 32, 240, 0.5);
        }

        /* ----- ORIGINAL MODE BUTTONS ----- */
        .buttons {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
        }

        .btn-plus {
            background: linear-gradient(135deg, #ff00ff, #cc00cc);
            border: none;
            padding: 18px 70px;
            font-size: 1.6rem;
            font-weight: 800;
            border-radius: 16px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 25px #ff00ff, 0 4px 18px rgba(0, 0, 0, 0.4);
            transition: all 0.15s ease;
            letter-spacing: 1px;
            width: 100%;
            text-align: center;
            min-height: 65px;
            position: relative;
            overflow: hidden;
        }
        .btn-plus:active {
            transform: scale(0.92);
            box-shadow: 0 0 40px #ff00ff, 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        .btn-plus.plus100 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            box-shadow: 0 0 35px #FFD700, 0 4px 20px rgba(255, 215, 0, 0.6);
            animation: pulseGold 0.8s ease-in-out infinite;
        }
        .btn-plus.plus200 {
            background: linear-gradient(135deg, #FF4500, #FF0000);
            box-shadow: 0 0 45px #FF4500, 0 4px 25px rgba(255, 69, 0, 0.7);
            animation: pulseOrange 0.5s ease-in-out infinite;
        }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 35px #FFD700, 0 4px 20px rgba(255, 215, 0, 0.6); }
            50% { box-shadow: 0 0 55px #FFD700, 0 4px 30px rgba(255, 215, 0, 0.9); }
        }
        @keyframes pulseOrange {
            0%, 100% { box-shadow: 0 0 45px #FF4500, 0 4px 25px rgba(255, 69, 0, 0.7); }
            50% { box-shadow: 0 0 70px #FF4500, 0 4px 40px rgba(255, 69, 0, 1); }
        }

        /* ----- CHAT MODE ----- */
        #chatModeContainer {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 420px;
            height: 72vh;
            max-height: 600px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            flex-direction: column;
            overflow: hidden;
            z-index: 15;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        body.mode-chat #chatModeContainer { display: flex; }
        #game {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-header {
            background: #7b1fa2;
            color: #fff;
            padding: 12px 18px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            border-bottom: 2px solid #6a1b9a;
        }
        .chat-header .chat-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .chat-title span { font-size: 1.2rem; }
        .chat-header .chat-online {
            margin-left: auto;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 400;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
            min-height: 200px;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 8px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            animation: msgFadeIn 0.25s ease;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        @keyframes msgFadeIn {
            0% { opacity: 0; transform: translateY(8px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-user {
            align-self: flex-end;
            background: #c8e6c9;
            border-bottom-right-radius: 4px;
        }
        .msg-user .msg-text {
            color: #4a148c;
            font-weight: 700;
        }

        .msg-bot {
            align-self: flex-start;
            background: #7b1fa2;
            border-bottom-left-radius: 4px;
        }
        .msg-bot .msg-name {
            font-weight: 600;
            font-size: 0.78rem;
            opacity: 0.85;
            display: block;
            margin-bottom: 1px;
            color: #e1bee7;
        }
        .msg-bot .msg-text {
            color: #ffffff;
            font-weight: 500;
        }

        .msg-system {
            align-self: center;
            background: rgba(0, 0, 0, 0.06);
            color: #888;
            font-size: 0.7rem;
            padding: 3px 14px;
            border-radius: 30px;
            max-width: 90%;
            text-align: center;
        }

        .chat-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 12px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }
        .chat-footer .btn-plus-chat {
            background: linear-gradient(135deg, #7b1fa2, #6a1b9a);
            border: none;
            padding: 10px 18px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(123, 31, 162, 0.3);
            transition: all 0.15s ease;
            min-width: 60px;
            flex-shrink: 0;
            min-height: 44px;
        }
        .chat-footer .btn-plus-chat:active { transform: scale(0.92); }
        .chat-footer .btn-plus-chat.plus100-chat {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            box-shadow: 0 2px 14px rgba(255, 215, 0, 0.5);
        }
        .chat-footer .btn-plus-chat.plus200-chat {
            background: linear-gradient(135deg, #FF4500, #FF0000);
            box-shadow: 0 2px 18px rgba(255, 69, 0, 0.5);
        }

        .chat-footer .chat-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 30px;
            font-size: 0.95rem;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            transition: border 0.2s;
            min-width: 0;
        }
        .chat-footer .chat-input:focus { border-color: #7b1fa2; }
        .chat-footer .chat-input::placeholder { color: #aaa; }

        body.mode-chat #originalModeContent .buttons {
            display: none !important;
        }
        body.mode-chat #originalModeContent .stats { margin-top: 70px; }

        /* ----- TOASTS ----- */
        #milestoneToast,
        #dopamineToast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
        }
        #milestoneToast {
            z-index: 300;
            background: rgba(0, 0, 0, 0.9);
            color: #FFD700;
            padding: 25px 35px;
            border-radius: 20px;
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            display: none;
            box-shadow: 0 0 60px #FFD700, 0 0 100px rgba(255, 215, 0, 0.5);
            border: 3px solid #FFD700;
            letter-spacing: 2px;
            animation: milestonePulse 1s ease-in-out infinite;
        }
        #dopamineToast {
            background: rgba(0, 0, 0, 0.9);
            color: #FF00FF;
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            display: none;
            box-shadow: 0 0 40px #FF00FF, 0 0 80px rgba(255, 0, 255, 0.5);
            border: 2px solid #FF00FF;
            animation: dopaminePulse 0.6s ease-in-out infinite;
            max-width: 90vw;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }
        @keyframes milestonePulse {
            0%, 100% { box-shadow: 0 0 60px #FFD700, 0 0 100px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 100px #FFD700, 0 0 160px rgba(255, 215, 0, 0.8); }
        }
        @keyframes dopaminePulse {
            0%, 100% { box-shadow: 0 0 40px #FF00FF, 0 0 80px rgba(255, 0, 255, 0.5);
                transform: translate(-50%, -50%) scale(1); }
            50% { box-shadow: 0 0 60px #FF00FF, 0 0 120px rgba(255, 0, 255, 0.7);
                transform: translate(-50%, -50%) scale(1.04); }
        }

        /* ----- SETUP ----- */
        #setup {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px 25px;
            border-radius: 20px;
            border: 2px solid rgba(255, 0, 255, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 35px rgba(255, 0, 255, 0.4);
            max-width: 320px;
            margin-top: 15vh;
        }
        #setup h2 {
            margin-bottom: 16px;
            color: #FFD700;
            font-size: 1.5rem;
            text-shadow: 0 0 15px #FFD700;
        }
        #nameInput {
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #ff00ff;
            margin-bottom: 12px;
            width: 230px;
            text-align: center;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            transition: all 0.2s;
        }
        #nameInput:focus {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }
        #nameInput::placeholder { color: rgba(255, 255, 255, 0.5); }
        #nameError {
            color: #FF4444;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: none;
            text-shadow: 0 0 8px #FF4444;
        }
        .setup-btn {
            background: linear-gradient(135deg, #ff00ff, #cc00cc);
            border: none;
            padding: 14px 50px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px #ff00ff;
            transition: all 0.2s;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        .setup-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 35px #ff00ff;
        }

        #game {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #game.mode-chat { background: transparent; }

        /* ----- CALCULATOR MODE ----- */
        body.mode-calculator {
            background: #0a0a0a !important;
            animation: none !important;
        }
        body.mode-calculator #originalModeContent .buttons {
            display: none !important;
        }
        /* Hide Live Rankings & stats card while Calculator Mode is active. */
        body.mode-calculator .leaderboard {
            display: none !important;
        }
        body.mode-calculator #originalModeContent .stats {
            display: none !important;
        }

        .calc-toggle-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            backdrop-filter: blur(5px);
            transition: all 0.25s;
            letter-spacing: 0.3px;
        }
        .calc-toggle-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        .calc-toggle-btn.active-calc {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        /* Fixed-position panel anchored to the viewport. Auto-scales to
           available height on any screen so nothing gets cut off. */
        #calculatorModeContainer {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 420px);
            max-height: calc(100vh - 90px);
            max-height: calc(100dvh - 90px);
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            background: rgba(10, 10, 10, 0.97);
            backdrop-filter: blur(12px);
            border: 2px solid #00ff00;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.35), 0 8px 40px rgba(0, 0, 0, 0.5);
            flex-direction: column;
            gap: 10px;
            z-index: 18;
            box-sizing: border-box;
        }
        body.mode-calculator #calculatorModeContainer { display: flex; }

        #calculatorModeContainer::-webkit-scrollbar { width: 6px; }
        #calculatorModeContainer::-webkit-scrollbar-track {
            background: rgba(0, 255, 0, 0.05);
            border-radius: 10px;
        }
        #calculatorModeContainer::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 0, 0.3);
            border-radius: 10px;
        }

        .calc-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
            color: #00ff00;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px #00ff00;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
            flex-shrink: 0;
        }
        /* Live "Your total" readout in the calculator header */
        .calc-your-total {
            margin-left: auto;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #ff00ff;
            background: rgba(255, 0, 255, 0.12);
            border: 1px solid rgba(255, 0, 255, 0.4);
            padding: 3px 12px;
            border-radius: 20px;
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.6);
            white-space: nowrap;
        }

        .calc-display-wrap {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 255, 0, 0.4);
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.15);
            min-height: 72px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            flex-shrink: 0;
        }

        .calc-expression {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: right;
            word-break: break-all;
            line-height: 1.2;
            min-height: 1.9rem;
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.6);
            overflow-wrap: anywhere;
        }

        .calc-result {
            color: #ff00ff;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: right;
            min-height: 1.1em;
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.6);
        }
        .calc-result.error {
            color: #ff5555;
            text-shadow: 0 0 8px rgba(255, 85, 85, 0.6);
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }

        .calc-btn {
            padding: 14px 0;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            transition: all 0.12s ease;
            border: 1px solid rgba(255, 255, 255, 0.12);
            min-height: 52px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .calc-btn:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.2);
        }
        .calc-btn.calc-op {
            background: rgba(255, 0, 255, 0.12);
            color: #ff66ff;
            border-color: rgba(255, 0, 255, 0.3);
        }
        .calc-btn.calc-op:active {
            background: rgba(255, 0, 255, 0.3);
        }
        .calc-btn.calc-clear {
            background: rgba(255, 60, 60, 0.15);
            color: #ff6666;
            border-color: rgba(255, 60, 60, 0.35);
        }
        .calc-btn.calc-equals {
            background: linear-gradient(135deg, #00ff00, #00aa00);
            color: #000;
            font-size: 1.5rem;
            box-shadow: 0 0 18px rgba(0, 255, 0, 0.5);
        }
        .calc-btn.calc-equals:active {
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
        }
        /* Undo-all-calculator-additions button (the Minus key) */
        .calc-btn.calc-undo {
            background: rgba(255, 60, 60, 0.18);
            color: #ff8080;
            border-color: rgba(255, 60, 60, 0.5);
            position: relative;
        }
        .calc-btn.calc-undo:active {
            background: rgba(255, 60, 60, 0.4);
            box-shadow: 0 0 20px rgba(255, 60, 60, 0.6);
        }
        .calc-btn.calc-undo::after {
            content: '↺';
            position: absolute;
            top: 3px;
            right: 6px;
            font-size: 0.7rem;
            opacity: 0.7;
            color: #ff8080;
        }

        .calc-quickadd {
            display: flex;
            gap: 8px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .calc-quick-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 0, 0.3);
            background: rgba(0, 0, 0, 0.6);
            color: #00ff00;
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
            font-family: inherit;
            min-width: 0;
        }
        .calc-quick-input:focus {
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        .calc-quick-input::placeholder { color: rgba(0, 255, 0, 0.35); }
        .calc-quick-btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            color: #000;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            font-family: inherit;
        }
        .calc-quick-btn:active { transform: scale(0.94); }

        .calc-back-btn {
            margin-top: 4px;
            padding: 12px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .calc-back-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        #calcToast {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 0, 0.95);
            color: #000;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 800;
            z-index: 500;
            display: none;
            box-shadow: 0 0 40px #00ff00, 0 0 80px rgba(0, 255, 0, 0.5);
            pointer-events: none;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        @keyframes calcToastPop {
            0%   { opacity: 0; transform: translateX(-50%) translateY(24px) scale(0.8); }
            18%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.06); }
            75%  { opacity: 1; transform: translateX(-50%) translateY(-8px) scale(1); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-32px) scale(0.92); }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .stat-green { font-size: 1.7rem; }
            .stat-magenta,
            .stat-gold { font-size: 1.0rem; }
            .btn-plus {
                padding: 14px 40px;
                font-size: 1.2rem;
                min-height: 56px;
            }
            #chatModeContainer {
                width: 95%;
                height: 65vh;

                border-radius: 18px;
            }

                font-size: 1rem;
                min-width: 50px;

            }
            .chat-footer .chat-input {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
            .msg {
                font-size: 0.85rem;
                padding: 6px 12px;
                max-width: 88%;
            }
            .top-bar { gap: 4px 8px; padding: 0 8px; }
            .lang-btn { font-size: 10px; padding: 4px 8px; }
            .mode-toggle-btn { font-size: 11px; padding: 4px 10px; }
            .calc-toggle-btn { font-size: 11px; padding: 4px 10px; }
            .btn-music { font-size: 11px; padding: 4px 10px; }
            #milestoneToast {
                font-size: 1.2rem;
                padding: 18px 25px;
            }
            .stats {
                margin-top: 62px;
                padding: 10px 14px;
                min-width: 200px;
            }
            .leaderboard { padding: 10px; }

            #calculatorModeContainer {
                width: 94vw;
                padding: 12px;
                gap: 8px;
                border-radius: 20px;
                max-height: calc(100vh - 80px);
                max-height: calc(100dvh - 80px);
            }
            .calc-header { font-size: 0.92rem; gap: 4px 8px; }
            .calc-your-total { font-size: 0.75rem; padding: 2px 10px; }
            .calc-display-wrap { min-height: 62px; padding: 8px 12px; }
            .calc-expression { font-size: 1.35rem; min-height: 1.6rem; }
            .calc-btn {
                padding: 10px 0;
                font-size: 1.05rem;
                min-height: 44px;
                border-radius: 10px;
            }
            .calc-btn.calc-equals { font-size: 1.25rem; }
            .calc-buttons { gap: 6px; }
            .calc-quick-input, .calc-quick-btn {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
            .calc-back-btn { padding: 9px; font-size: 0.9rem; }
            #calcToast { font-size: 1rem; padding: 10px 22px; }
        }

        @media (max-width: 380px) {
            .stat-green { font-size: 1.4rem; }
            .btn-plus {
                font-size: 1.0rem;
                padding: 12px 30px;
                min-height: 48px;
            }

                height: 55vh;
                max-height: 420px;

        @media (max-height: 700px) and (min-width: 481px) {

                padding: 12px;
                gap: 8px;
                max-height: calc(100vh - 80px);
                max-height: calc(100dvh - 80px);

            .calc-display-wrap { min-height: 60px; padding: 8px 12px; }

<body>

<!-- ===== TOP BAR ===== -->
<div class="top-bar" id="topBar">
    <div class="lang-selector" id="langSelector">
        <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="ko" onclick="setLanguage('ko')">한국어</button>
        <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')">FR</button>
        <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
    </div>
    <button class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleMode()">🎯 Group Chat Chaos</button>
    <button class="calc-toggle-btn" id="calcToggleBtn" onclick="toggleCalculatorMode()" style="display:none;">🧮 Calculator</button>
    <button class="btn-music" id="musicBtn" onclick="toggleMusic()">♪ Play Music</button>
</div>

<!-- ===== TOASTS ===== -->
<div id="milestoneToast"></div>
<div id="dopamineToast"></div>
<div id="calcToast"></div>

<!-- ===== SETUP ===== -->
<div id="setup">
    <h2 id="setupTitle">Enter your name</h2>
    <div id="nameError"></div>
    <input id="nameInput" placeholder="Your name" maxlength="12" autocomplete="off">
    <br>
    <button class="setup-btn" onclick="startGame()" id="startBtn">Start</button>
</div>

<!-- ===== GAME ===== -->
<div id="game" style="display:none; width:100%; text-align:center;">

    <div id="originalModeContent" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="stats" id="statsContainer">
            <div class="stat-green" id="totalStat">Total: 0</div>
            <div class="stat-magenta" id="yourTotalStat">Your total: 0</div>
            <div class="stat-gold" id="thisGameStat">This game: 0</div>
        </div>

        <div class="buttons">
            <button class="btn-plus" id="plusBtn" onclick="addOne()">+1</button>
        </div>

        <div class="leaderboard" id="leaderboard"></div>
    </div>

    <div id="chatModeContainer">
        <div class="chat-header">
            <div class="chat-title"><span>💬</span> Group Chat Chaos</div>
            <div class="chat-online" id="chatOnlineCount">● 5 online</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="msg msg-system">🎉 Welcome! Numbers fly in real-time.</div>
        </div>
        <div class="chat-footer">
            <button class="btn-plus-chat" id="plusBtnChat" onclick="addOneChat()">+1</button>
            <input class="chat-input" id="chatInput" type="text" placeholder="Type a message…" readonly
                   onfocus="this.blur()" onmousedown="this.blur()" ontouchstart="this.blur()">
        </div>
    </div>

    <div id="calculatorModeContainer">
        <div class="calc-header">
            <span id="calcTitle">🧮 Calculator</span>
            <span class="calc-your-total" id="calcYourTotal">Your total: 0</span>
        </div>
        <div class="calc-display-wrap">
            <div class="calc-expression" id="calcDisplay">0</div>
            <div class="calc-result" id="calcResult"></div>
        </div>
        <div class="calc-buttons">
            <button class="calc-btn calc-clear" onclick="calcClear()">C</button>
            <button class="calc-btn calc-op" onclick="calcBackspace()">⌫</button>
            <button class="calc-btn calc-op" onclick="calcPress('(')">(</button>
            <button class="calc-btn calc-op" onclick="calcPress(')')">)</button>

            <button class="calc-btn" onclick="calcPress('7')">7</button>
            <button class="calc-btn" onclick="calcPress('8')">8</button>
            <button class="calc-btn" onclick="calcPress('9')">9</button>
            <button class="calc-btn calc-op" onclick="resetAllScores()" title="Reset all scores">÷</button>

            <button class="calc-btn" onclick="calcPress('4')">4</button>
            <button class="calc-btn" onclick="calcPress('5')">5</button>
            <button class="calc-btn" onclick="calcPress('6')">6</button>
            <button class="calc-btn calc-op" onclick="calcPress('×')">×</button>

            <button class="calc-btn" onclick="calcPress('1')">1</button>
            <button class="calc-btn" onclick="calcPress('2')">2</button>
            <button class="calc-btn" onclick="calcPress('3')">3</button>
            <button class="calc-btn calc-undo" id="calcUndoBtn" onclick="calcUndoAll()" title="Undo all Calculator Mode additions">−</button>

            <button class="calc-btn" onclick="calcPress('0')">0</button>
            <button class="calc-btn" onclick="calcPress('.')">.</button>
            <button class="calc-btn calc-equals" onclick="calcEvaluate()">=</button>
            <button class="calc-btn calc-op" onclick="calcPress('+')">+</button>
        </div>
        <div class="calc-quickadd">
            <input type="number" id="calcQuickAdd" class="calc-quick-input"
                   placeholder="Quick add amount…" inputmode="numeric">
            <button class="calc-quick-btn" id="calcQuickAddBtn" onclick="calcQuickAdd()">Add</button>
        </div>
        <button class="calc-back-btn" id="calcBackBtn" onclick="switchFromCalculatorMode()">← Back to Game</button>
    </div>

</div>

<script>
    const ChillSpaceMusic = (function () {
        'use strict';

        const SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        const PITCH_RE = /^([A-Ga-g])(#{1,2}|b{1,2})?(-?\d{1,2})$/;

        function pitchToMidi(value) {
            const m = PITCH_RE.exec(String(value).trim());
            if (!m) return null;
            let semi = SEMITONES[m[1].toUpperCase()];
            const acc = m[2] || '';
            if (acc === '#')  semi += 1;
            if (acc === '##') semi += 2;
            if (acc === 'b')  semi -= 1;
            if (acc === 'bb') semi -= 2;
            return (parseInt(m[3], 10) + 1) * 12 + semi;
        }
        const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

        function localName(el) { return (el.localName || el.tagName || '').toLowerCase(); }
        function attr(el, n) { return el.hasAttribute && el.hasAttribute(n) ? el.getAttribute(n) : null; }
        function attrAny(el, names) { for (const n of names) { const v = attr(el, n); if (v !== null) return v; } return null; }
        function numOrNull(v) {
            if (v === null || v === undefined || String(v).trim() === '') return null;
            const n = parseFloat(v);
            return Number.isFinite(n) ? n : null;
        }
        function numFrom(v, d) { const n = numOrNull(v); return n === null ? d : n; }
        function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

        const COLORS = ['#4f9cf9','#3fb950','#e3b341','#f778ba','#a371f7','#39c5cf'];

        function readNote(el, track) {
            let midi = null;
            const midiAttr = numOrNull(attr(el, 'midi'));
            if (midiAttr !== null) midi = Math.round(midiAttr);
            if (midi === null) {
                const p = (attr(el, 'pitch') || (el.textContent || '').trim() || '').trim();
                if (p) {
                    const lc = p.toLowerCase();
                    if (lc === 'rest' || lc === 'r' || lc === '-') return null;
                    midi = pitchToMidi(p);
                }
            }
            if (midi === null) return null;
            return {
                midi: clamp(midi, 0, 127),
                duration: Math.max(0.001, numFrom(attrAny(el, ['duration','dur']), 1)),
                velocity: clamp(numFrom(attrAny(el, ['velocity','vel']), 0.8), 0, 1),
                time: 0, track
            };
        }

        function parseSong(xmlText) {
            const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
            const perr = doc.getElementsByTagName('parsererror')[0] ||
                         doc.getElementsByTagNameNS('*', 'parsererror')[0];
            if (perr) throw new Error('XML parse error: ' + perr.textContent.slice(0, 200));
            const root = doc.documentElement;
            if (!root || localName(root) !== 'song') throw new Error('Root element must be <song>');

            const song = {
                title: attr(root, 'title') || 'Untitled',
                tempo: clamp(numFrom(attr(root, 'tempo'), 120), 20, 400),
                tracks: [], events: [], duration: 0
            };

            const trackEls = Array.from(root.children).filter(e => localName(e) === 'track');
            trackEls.forEach((te, i) => {
                const track = {
                    name: attr(te, 'name') || 'Track ' + (i + 1),
                    instrument: (attr(te, 'instrument') || 'sine').trim().toLowerCase(),
                    volume: clamp(numFrom(attr(te, 'volume'), 0.7), 0, 1),
                    pan: clamp(numFrom(attr(te, 'pan'), 0), -1, 1),
                    color: attr(te, 'color') || COLORS[i % COLORS.length],
                    notes: []
                };
                let cursor = 0;
                for (const el of Array.from(te.children)) {
                    const tag = localName(el);
                    if (tag === 'note') {
                        const note = readNote(el, track);
                        if (!note) continue;
                        const t = numOrNull(attr(el, 'time'));
                        note.time = t !== null ? Math.max(0, t) : cursor;
                        cursor = note.time + note.duration;
                        track.notes.push(note);
                    } else if (tag === 'chord') {
                        const t = numOrNull(attr(el, 'time'));
                        const start = t !== null ? Math.max(0, t) : cursor;
                        const chordDur = numOrNull(attr(el, 'duration'));
                        let maxDur = 0, count = 0;
                        for (const ne of Array.from(el.children)) {
                            if (localName(ne) !== 'note') continue;
                            const note = readNote(ne, track);
                            if (!note) continue;
                            if (chordDur !== null) note.duration = Math.max(0.001, chordDur);
                            note.time = start;
                            if (note.duration > maxDur) maxDur = note.duration;
                            track.notes.push(note);
                            count++;
                        }
                        cursor = start + (count ? maxDur : (chordDur || 1));
                    } else if (tag === 'rest') {
                        const t = numOrNull(attr(el, 'time'));
                        const start = t !== null ? Math.max(0, t) : cursor;
                        cursor = start + Math.max(0, numFrom(attr(el, 'duration'), 1));
                    }
                }
                song.tracks.push(track);
            });

            for (const track of song.tracks)
                for (const note of track.notes) song.events.push(note);
            song.events.sort((a, b) => a.time - b.time || a.midi - b.midi);
            song.duration = song.events.reduce((m, e) => Math.max(m, e.time + e.duration), 0);
            return song;
        }

        function makeEnv(ctx, t, dur, vel, o) {
            const a = o.a ?? 0.01, d = o.d ?? 0.08, s = o.s ?? 0.65, r = o.r ?? 0.25;
            const peak = Math.max(0.0005, vel);
            const g = ctx.createGain();
            const off = Math.max(t + dur, t + a + 0.02);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(peak, t + a);
            g.gain.setTargetAtTime(peak * s, t + a, Math.max(0.005, d) / 3);
            g.gain.setTargetAtTime(0.0001, off, Math.max(0.01, r) / 3);
            return { gain: g, stopAt: off + Math.max(0.05, r) * 4 };
        }

        function voiceSquare(ctx, dest, freq, t, dur, vel) {
            const o1 = ctx.createOscillator();
            o1.type = 'sawtooth'; o1.frequency.setValueAtTime(freq, t);
            const o2 = ctx.createOscillator();
            o2.type = 'sawtooth'; o2.frequency.setValueAtTime(freq, t);
            o2.detune.setValueAtTime(8, t);

            const lp = ctx.createBiquadFilter();
            lp.type = 'lowpass'; lp.Q.value = 2.5;
            lp.frequency.setValueAtTime(Math.min(6000, freq * 8), t);
            lp.frequency.exponentialRampToValueAtTime(Math.max(600, freq * 1.5), t + dur + 0.2);

            const { gain, stopAt } = makeEnv(ctx, t, dur, vel * 0.22,
                { a: 0.008, d: 0.06, s: 0.55, r: 0.18 });
            o1.connect(lp); o2.connect(lp);
            lp.connect(gain).connect(dest);
            o1.start(t); o2.start(t);
            o1.stop(stopAt); o2.stop(stopAt);
            return { sources: [o1, o2], stopAt };
        }

        function voicePiano(ctx, dest, freq, t, dur, vel) {
            const decay = 0.9 + Math.min(dur, 2.5) * 0.6;
            const endTime = t + decay + 0.15;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(vel * 0.30, t + 0.006);
            g.gain.exponentialRampToValueAtTime(0.0001, t + decay);

            const lp = ctx.createBiquadFilter();
            lp.type = 'lowpass'; lp.Q.value = 1.2;
            lp.frequency.setValueAtTime(Math.min(7000, freq * 8), t);
            lp.frequency.exponentialRampToValueAtTime(Math.max(500, freq * 1.5), t + decay);
            lp.connect(g).connect(dest);

            const o1 = ctx.createOscillator();
            o1.type = 'triangle'; o1.frequency.value = freq;
            o1.connect(lp); o1.start(t); o1.stop(endTime);

            const o2 = ctx.createOscillator();
            o2.type = 'sine'; o2.frequency.value = freq * 2;
            const g2 = ctx.createGain(); g2.gain.value = 0.35;
            o2.connect(g2).connect(lp);
            o2.start(t); o2.stop(endTime);

            return { sources: [o1, o2], stopAt: endTime };
        }

        function voicePad(ctx, dest, freq, t, dur, vel) {
            const attack = 0.35, release = 1.1;
            const off = Math.max(t + dur, t + attack + 0.02);
            const stopAt = off + release * 3;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(vel * 0.11, t + attack);
            g.gain.setTargetAtTime(0.0001, off, release / 3);

            const lp = ctx.createBiquadFilter();
            lp.type = 'lowpass'; lp.frequency.value = Math.min(3500, freq * 6);
            lp.Q.value = 0.7;
            lp.connect(g).connect(dest);

            const oscs = [];
            for (const detune of [-7, 0, 7]) {
                const o = ctx.createOscillator();
                o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = detune;
                o.connect(lp); o.start(t); o.stop(stopAt);
                oscs.push(o);
            }
            return { sources: oscs, stopAt };
        }

        function voiceBass(ctx, dest, freq, t, dur, vel) {
            const endTime = t + dur + 0.3;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(vel * 0.42, t + 0.01);
            g.gain.setTargetAtTime(0.0001, t + dur * 0.5, 0.18);

            const lp = ctx.createBiquadFilter();
            lp.type = 'lowpass'; lp.Q.value = 3.5;
            lp.frequency.setValueAtTime(Math.min(1200, freq * 5), t);
            lp.frequency.exponentialRampToValueAtTime(Math.max(180, freq * 1.2), t + dur);
            lp.connect(g).connect(dest);

            const o1 = ctx.createOscillator();
            o1.type = 'sawtooth'; o1.frequency.value = freq;
            o1.connect(lp); o1.start(t); o1.stop(endTime);

            const o2 = ctx.createOscillator();
            o2.type = 'sine'; o2.frequency.value = freq / 2;
            const g2 = ctx.createGain(); g2.gain.value = 0.55;
            o2.connect(g2).connect(lp);
            o2.start(t); o2.stop(endTime);

            return { sources: [o1, o2], stopAt: endTime };
        }

        function voiceTriangle(ctx, dest, freq, t, dur, vel) {
            const o = ctx.createOscillator();
            o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
            const { gain, stopAt } = makeEnv(ctx, t, dur, vel * 0.35,
                { a: 0.01, d: 0.08, s: 0.55, r: 0.22 });
            o.connect(gain).connect(dest);
            o.start(t); o.stop(stopAt);
            return { sources: [o], stopAt };
        }

        const INSTRUMENTS = {
            square: voiceSquare, sawtooth: voiceSquare, lead: voiceSquare,
            piano: voicePiano, pluck: voicePiano, guitar: voicePiano,
            pad: voicePad, strings: voicePad,
            bass: voiceBass,
            triangle: voiceTriangle, sine: voiceTriangle, bell: voiceTriangle,
            organ: voiceTriangle, music_box: voiceTriangle
        };
        const getVoice = name => INSTRUMENTS[name] || voiceTriangle;

        class LoopPlayer {
            constructor(ctx, dest, song) {
                this.ctx = ctx; this.dest = dest; this.song = song;
                this.secPerBeat = 60 / song.tempo;
                this.loopSeconds = song.duration * this.secPerBeat + 0.5;
                this.out = ctx.createGain();
                this.out.gain.value = 0;
                this.out.connect(dest);
                this.running = false; this.timer = null;
                this.loopStartTime = 0; this.loopIteration = 0;
                this.eventIndex = 0; this.sources = new Set();
            }

            start(when, fadeIn) {
                this.running = true;
                this.loopStartTime = when;
                this.loopIteration = 0;
                this.eventIndex = 0;
                const g = this.out.gain;
                g.cancelScheduledValues(when);
                g.setValueAtTime(0.0001, when);
                g.exponentialRampToValueAtTime(1, when + (fadeIn || 0.5));
                this.timer = setInterval(() => this.tick(), 25);
                this.tick();
            }

            tick() {
                if (!this.running) return;
                const ctx = this.ctx;
                const horizon = ctx.currentTime + 0.4;
                let guard = 0;
                while (guard++ < 500) {
                    if (this.eventIndex >= this.song.events.length) {
                        this.eventIndex = 0;
                        this.loopIteration++;
                        continue;
                    }
                    const ev = this.song.events[this.eventIndex];
                    const absTime = this.loopStartTime
                                  + this.loopIteration * this.loopSeconds
                                  + ev.time * this.secPerBeat;
                    if (absTime > horizon) break;
                    if (absTime >= ctx.currentTime - 0.02) this.schedule(ev, absTime);
                    this.eventIndex++;
                }
            }

            schedule(ev, when) {
                const ctx = this.ctx;
                const track = ev.track;
                const g = ctx.createGain();
                g.gain.value = track.volume;
                if (ctx.createStereoPanner) {
                    const p = ctx.createStereoPanner();
                    p.pan.value = track.pan;
                    g.connect(p).connect(this.out);
                } else g.connect(this.out);

                const freq = midiToFreq(ev.midi);
                const dur = Math.max(0.02, ev.duration * this.secPerBeat * 0.95);
                let result;
                try { result = getVoice(track.instrument)(ctx, g, freq, when, dur, ev.velocity); }
                catch (e) { return; }

                if (result && result.sources) {
                    for (const s of result.sources) this.sources.add(s);
                    const delay = Math.max(0, (result.stopAt - ctx.currentTime + 0.5) * 1000);
                    setTimeout(() => {
                        for (const s of result.sources) this.sources.delete(s);
                    }, delay);
                }
            }

            fadeOutAndStop(dur) {
                if (!this.running) return;
                const now = this.ctx.currentTime;
                const g = this.out.gain;
                g.cancelScheduledValues(now);
                g.setValueAtTime(Math.max(0.0001, g.value), now);
                g.exponentialRampToValueAtTime(0.0001, now + dur);
                this.running = false;
                const myTimer = this.timer; this.timer = null;
                setTimeout(() => {
                    if (myTimer) clearInterval(myTimer);
                    for (const src of this.sources) { try { src.stop(); } catch (e) {} }
                    this.sources.clear();
                    try { this.out.disconnect(); } catch (e) {}
                }, dur * 1000 + 200);
            }
        }

        class MusicManager {
            constructor() {
                this.ctx = null; this.master = null;
                this.current = null; this.song = null;
                this.volume = 0.5;
            }
            _ensureCtx() {
                if (this.ctx) {
                    if (this.ctx.state === 'suspended') try { this.ctx.resume(); } catch (e) {}
                    return this.ctx;
                }
                const Ctor = window.AudioContext || window.webkitAudioContext;
                if (!Ctor) return null;
                this.ctx = new Ctor();
                this.master = this.ctx.createGain();
                this.master.gain.value = this.volume;
                const comp = this.ctx.createDynamicsCompressor();
                comp.threshold.value = -12; comp.knee.value = 22;
                comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.2;
                this.master.connect(comp); comp.connect(this.ctx.destination);
                return this.ctx;
            }
            loadFromString(xml) { this.song = parseSong(xml); return this.song; }
            play() {
                if (!this.song) return;
                const ctx = this._ensureCtx();
                if (!ctx) return;
                if (this.current && this.current.running) return;
                if (this.current) { this.current.fadeOutAndStop(0.1); this.current = null; }
                const player = new LoopPlayer(ctx, this.master, this.song);
                this.current = player;
                player.start(ctx.currentTime + 0.03, 0.6);
            }
            pause() {
                if (this.current) { this.current.fadeOutAndStop(0.4); this.current = null; }
            }
            stop() { this.pause(); }
            setVolume(v) {
                this.volume = Math.max(0, Math.min(1, v));
                if (this.master && this.ctx) {
                    const now = this.ctx.currentTime;
                    this.master.gain.cancelScheduledValues(now);
                    this.master.gain.setTargetAtTime(this.volume, now, 0.05);
                }
            }
        }

        const manager = new MusicManager();

        function tryLoad() {
            const el = document.getElementById('shrunkSongXml');
            if (!el) { console.warn('[ChillSpaceMusic] No #shrunkSongXml element found'); return; }
            try {
                const song = manager.loadFromString(el.textContent);
                console.log('[ChillSpaceMusic] Loaded:', song.title,
                            '—', song.tracks.length, 'tracks,',
                            song.events.length, 'notes,', song.tempo, 'BPM');
            } catch (e) {
                console.error('[ChillSpaceMusic] Parse failed:', e);
            }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tryLoad);
        else tryLoad();

        return manager;
    })();
</script>

            bots: bots,

    // ==================== BOT NAMES ====================
    function getBotNames() {
        const defaultNames = ["Astra", "Nova", "Zed", "Kira", "Bot-5"];
        try {
            const friendsRaw = localStorage.getItem('chillspace_friends');
            if (friendsRaw) {
                const friends = JSON.parse(friendsRaw);
                if (Array.isArray(friends) && friends.length > 0) {
                    const friendNames = friends.map(f => {
                        if (typeof f === 'string') return f;
                        if (f && typeof f === 'object' && f.name) return f.name;
                        if (f && typeof f === 'object' && f.username) return f.username;
                        if (f && typeof f === 'object' && f.displayName) return f.displayName;
                        return null;
                    }).filter(n => n && n.trim().length > 0);
                    if (friendNames.length > 0) {
                        const shuffled = [...friendNames].sort(() => Math.random() - 0.5);
                        const picked = shuffled.slice(0, 5);
                        while (picked.length < 5) {
                            picked.push(defaultNames[picked.length % defaultNames.length]);
                        }
                        return picked;
                    }
                }
            }
        } catch (e) { /* ignore */ }
        return defaultNames;
    }

    function refreshBotNames() {
        const newNames = getBotNames();
        const oldBots = bots;
        const newBots = newNames.map(name => {
            const existing = oldBots.find(b => b.name === name);
            return {
                name: name,
                score: existing ? existing.score : 0
            };
        });
        bots = newBots;
    }

    function initBots() {
        if (bots.length === 0) {
            refreshBotNames();
        }
        while (bots.length < 5) {
            const names = getBotNames();
            const used = bots.map(b => b.name);
            const available = names.filter(n => !used.includes(n));
            if (available.length > 0) {
                bots.push({ name: available[0], score: 0 });
            } else {
                bots.push({ name: 'Bot-' + (bots.length + 1), score: 0 });
            }
        }
    }

    // ==================== TOTAL COUNT ====================
    function getTotalCount() {
        let sum = player.score;
        bots.forEach(b => { sum += b.score; });
        return sum;
    }

    // ==================== OFFLINE CATCHUP ====================
    function offlineCatchup() {
        const timeOffline = Date.now() - lastSaveTime;
        if (timeOffline > 5000) {
            bots.forEach(b => {
                const diff = Math.max(0, player.score - b.score);
                const minAdd = Math.floor(diff * 0.5);
                const maxAdd = Math.floor(diff * 2);
                const add = minAdd + Math.floor(Math.random() * (maxAdd - minAdd + 1));
                b.score += add;
            });
        }
    }

    // ==================== VIBRATION ====================
    function safeVibrate(pattern) {
        if (navigator.vibrate) {
            navigator.vibrate(pattern);
        } else if (window.AndroidVibrator) {
            if (Array.isArray(pattern)) {
                let total = pattern.reduce((a, b) => a + b, 0);
                window.AndroidVibrator.vibrate(total);
            } else {
                window.AndroidVibrator.vibrate(pattern);
            }
        }
    }

    // ==================== CHAT MESSAGES ====================
    function addChatMessage(type, sender, number, botName) {
        const entry = {
            type: type,
            sender: sender || (type === 'user' ? player.name : 'bot'),
            number: number,
            botName: botName || '',
            timestamp: Date.now()
        };
        chatMessages.push(entry);
        if (chatMessages.length > 200) {
            chatMessages = chatMessages.slice(-200);
        }
        renderChatMessages();
        scrollChatToBottom();
    }

    function renderChatMessages() {
        const container = document.getElementById('chatMessages');
        if (!container) return;
        const systemMsg = container.querySelector('.msg-system');
        container.innerHTML = '';
        if (systemMsg) {
            container.appendChild(systemMsg);
        } else {
            const sys = document.createElement('div');
            sys.className = 'msg msg-system';
            sys.textContent = '🎉 Welcome! Numbers fly in real-time.';
            container.appendChild(sys);
        }
        const msgs = chatMessages.slice(-50);
        msgs.forEach(entry => {
            const div = document.createElement('div');
            if (entry.type === 'user') {
                div.className = 'msg msg-user';
                const textSpan = document.createElement('span');
                textSpan.className = 'msg-text';
                textSpan.textContent = entry.number;
                div.appendChild(textSpan);
            } else {
                div.className = 'msg msg-bot';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'msg-name';
                nameSpan.textContent = entry.botName || entry.sender || 'Bot';
                const textSpan = document.createElement('span');
                textSpan.className = 'msg-text';
                textSpan.textContent = entry.number;
                div.appendChild(nameSpan);
                div.appendChild(textSpan);
            }
            container.appendChild(div);
        });
        updateChatOnlineCount();
    }
