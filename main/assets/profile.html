<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Profile - ChillSpace</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f2f5;
            color: #1c1e21;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #dddfe2;
            padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-title { font-weight: 800; font-size: 20px; color: #1877f2; }
        main { padding: 16px 12px 80px; max-width: 600px; margin: 0 auto; }
        .profile-card {
            background: #fff; border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            padding: 20px; margin-bottom: 16px; text-align: center;
        }
        .profile-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #1877f2, #7c3aed);
            margin: 0 auto 12px; display: flex; align-items: center;
            justify-content: center; color: #fff; font-size: 32px; font-weight: 800;
        }
        .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .profile-stats { display: flex; justify-content: center; gap: 20px; color: #65676b; font-size: 14px; margin-top: 10px; }
        .stat-item b { color: #1c1e21; }
        .stat-item .reach-label { color: #7c3aed; }

        .post {
            background: #fff; border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            padding: 14px 0; margin-bottom: 16px;
            position: relative;
        }
        .post-header { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
        .avatar-small {
            width: 36px; height: 36px; border-radius: 50%;
            background: #e4e6eb; display: flex; align-items: center;
            justify-content: center; font-weight: 700; color: #fff;
        }
        .post-meta { flex: 1; min-width: 0; }
        .post-name { font-weight: 600; font-size: 15px; }
        .post-time { font-size: 12px; color: #65676b; }
        .post-content { padding: 10px 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .post-image, .post-video { width: 100%; max-height: 400px; object-fit: cover; margin-top: 8px; }

        .delete-btn {
            position: absolute; top: 12px; right: 12px;
            background: #f0f2f5; border: none; border-radius: 50%;
            width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #65676b; font-weight: bold; transition: background 0.2s;
        }
        .delete-btn:hover { background: #fee2e2; color: #dc2626; }

        .actions { display: flex; border-top: 1px solid #e4e6eb; margin-top: 8px; padding: 6px 12px 0; gap: 10px; }
        .action-item { font-size: 13px; font-weight: 600; color: #65676b; display: flex; align-items: center; gap: 4px; }
        .likes-count { color: #21a366; }
        .analytics-btn { background: none; border: 1px solid #e4e6eb; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #1877f2; cursor: pointer; }
        .analytics-btn:hover { background: #f0f2f5; }

        .comments-toggle {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #65676b;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .comments-toggle:hover { color: #1877f2; text-decoration: underline; }
        .comments-toggle .chev { font-size: 9px; line-height: 1; }

        /* --- "Buy likes" placebo ad button --- */
        .ad-btn {
            display: block;
            width: calc(100% - 32px);
            margin: 12px 16px 2px;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.35;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.28);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .ad-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(239, 68, 68, 0.38); }
        .ad-btn:active { transform: translateY(0); }

        .comments-section { padding: 8px 16px 0; border-top: 1px solid #f0f2f5; margin-top: 8px; }
        .comment-item { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13.5px; }
        .c-avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
        .c-bubble { background: #f0f2f5; border-radius: 12px; padding: 6px 10px; flex: 1; }
        .c-name { font-weight: 700; font-size: 12px; margin-bottom: 2px; }

        .empty-state { text-align: center; padding: 40px 20px; color: #65676b; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; display: block; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; z-index: 3000; display: none;
            max-width: 90vw; text-align: center;
        }

        /* --- Modal shell --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.18s ease-out;
            text-align: left;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #1c1e21;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 18px;
        }
        .modal-cancel {
            background: #1877f2;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-cancel:hover { background: #166fe5; }
        .modal-secondary {
            background: #e4e6eb;
            color: #1c1e21;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 8px;
        }
        .modal-secondary:hover { background: #d8dadf; }

        /* --- Ad modal bits --- */
        .ad-question { font-size: 13px; color: #65676b; margin-bottom: 2px; }
        .ad-amount {
            font-size: 34px; font-weight: 800; color: #1877f2;
            text-align: center; margin: 2px 0 2px; letter-spacing: -0.5px;
        }
        .ad-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e4e6eb;
            outline: none;
            margin: 16px 0 6px;
        }
        .ad-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: #1877f2;
            border: 3px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .ad-slider::-moz-range-thumb {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: #1877f2;
            border: 3px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .ad-slider-labels {
            display: flex; justify-content: space-between;
            font-size: 11px; color: #65676b; font-weight: 600;
        }
        .ad-estimate-box {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #f0f7ff;
            border-left: 4px solid #1877f2;
            display: flex; align-items: center; justify-content: space-between;
        }
        .ad-estimate-label { font-size: 13px; font-weight: 600; color: #65676b; }
        .ad-estimate-value { font-size: 20px; font-weight: 800; color: #21a366; }
        .ad-credit-note {
            margin-top: 12px;
            font-size: 12px;
            color: #65676b;
            text-align: center;
            line-height: 1.45;
        }
        .ad-credit-note b { color: #1877f2; }
    </style>
</head>
<body>
<header>
    <div class="header-title">Your Profile</div>
</header>

<main id="main">
    <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar">Y</div>
        <div class="profile-name" id="profileName">You</div>
        <div class="profile-stats">
            <div class="stat-item"><b id="postCount">0</b> Posts</div>
            <div class="stat-item"><b id="totalLikes">0</b> Likes</div>
            <div class="stat-item"><b id="totalReach" class="reach-label">0</b> Reach</div>
        </div>
    </div>

    <div id="postsContainer"></div>
</main>

<div id="toast" class="toast"></div>

<!-- Analytics Modal -->
<div id="analyticsOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-title">Post Analytics</div>
        <div id="analyticsContent"></div>
        <div class="modal-actions">
            <button class="modal-cancel" onclick="closeAnalytics()">Close</button>
        </div>
    </div>
</div>

<!-- Ad Credit Modal -->
<div id="adOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-title">Boost this post 🚀</div>

        <div class="ad-question">How much do you want to spend?</div>
        <div class="ad-amount" id="adSpendAmount">$50</div>

        <input type="range" class="ad-slider" id="adSlider" min="1" max="1000" step="1" value="50"
               oninput="updateAdEstimate()">
        <div class="ad-slider-labels"><span>$1</span><span>$1,000</span></div>

        <div class="ad-estimate-box">
            <div class="ad-estimate-label">Estimated like growth</div>
            <div class="ad-estimate-value" id="adEstimate">+0 likes</div>
        </div>

        <div class="ad-credit-note">
            💳 ChillSpace Ads credit: <b>$1,000,000 FREE</b><br>
            Don't worry — it never runs out. (It's a placebo platform, shhh.)
        </div>

        <div class="modal-actions">
            <button class="modal-secondary" onclick="closeAdModal()">Cancel</button>
            <button class="modal-cancel" onclick="purchaseAd()">Purchase Ad Space</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'chillspace_own_posts';
    const FRIENDS_KEY = 'chillspace_friends';
    const NAME_KEY    = 'chillspace_display_name';

    /* ---------------------------------------------------------------
       Live like state
       liveLikes holds the CURRENT like count for every post id and is
       the single source of truth while the page is open. It gets
       flushed into localStorage periodically and on unload.
       --------------------------------------------------------------- */
    const liveLikes = new Map();   // postId -> number
    const tickers   = new Map();   // postId -> timeout handle
    const expandedComments = new Set(); // postIds whose comments are open

    function recordLikeHistory(postId, count) {
        const posts = getPosts();
        const post = posts.find(p => String(p.id) === String(postId));
        if (!post) return;

        if (!post.likeHistory) post.likeHistory = [];
        // Only record if it changed significantly or enough time passed?
        // User said "only the last 20 like changes per post will be stored"
        const last = post.likeHistory[post.likeHistory.length - 1];
        if (last === count) return;

        post.likeHistory.push(count);
        if (post.likeHistory.length > 20) post.likeHistory.shift();
        savePosts(posts);
    }

    /* ---------------------------------------------------------------
       Deterministic hashing helpers
       --------------------------------------------------------------- */
    function getStringSeed(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return Math.abs(hash);
    }

    /* -----------------------------------------------------------------
       Like calculation (seeded baseline for a brand-new post)
       ----------------------------------------------------------------- */
    function calculateLikes(content, timestamp) {
        const seed = getStringSeed(content || '');
        const msElapsed = Math.max(0, Date.now() - new Date(timestamp).getTime());
        const hours = msElapsed / 3600000;

        const potentialMax = 50 + (seed % 950);
        const rate         = 1 + (seed % 10) / 10;
        const base         = 3 + (seed % 18);
        const growth       = Math.floor(Math.pow(hours + 0.25, 0.85) * 6 * rate);

        return Math.min(base + growth, potentialMax);
    }

    /* ---------------------------------------------------------------
       Storage helpers
       --------------------------------------------------------------- */
    function getPosts() {
        try {
            const posts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            let updated = false;
            posts.forEach(post => {
                if (post.mediaUrl && (post.mediaUrl.startsWith('blob:') || !post.mediaUrl.includes('://'))) {
                    try {
                        if (window.AndroidUtils && typeof window.AndroidUtils.getLatestMediaUri === 'function') {
                            const isVideo = post.mediaType === 'video';
                            const localUri = window.AndroidUtils.getLatestMediaUri(isVideo);
                            if (localUri) {
                                post.mediaUrl = localUri;
                                updated = true;
                            }
                        }
                    } catch (e) {}
                }
            });
            if (updated) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
            }
            return posts;
        } catch (e) {
            return [];
        }
    }
    function savePosts(posts) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        updateStats();
    }
    function getFriends() {
        try { return JSON.parse(localStorage.getItem(FRIENDS_KEY) || '[]'); }
        catch (e) { return []; }
    }

    /* ---------------------------------------------------------------
       Live like accessors
       --------------------------------------------------------------- */
    function getLiveLikes(post) {
        const key = String(post.id);
        let v = liveLikes.get(key);
        if (v === undefined) {
            v = (typeof post.likes === 'number')
                ? post.likes
                : calculateLikes(post.content, post.timestamp);
            liveLikes.set(key, v);

            // Initialize history if empty
            const posts = getPosts();
            const pObj = posts.find(p => String(p.id) === key);
            if (pObj && (!pObj.likeHistory || pObj.likeHistory.length === 0)) {
                pObj.likeHistory = [v];
                savePosts(posts);
            }
        }
        return v;
    }

    function setLiveLikes(postId, value) {
        liveLikes.set(String(postId), Math.max(0, Math.round(value)));
    }

    // Write the in-memory like counts back to localStorage (only if changed).
    function persistLikes() {
        const posts = getPosts();
        let changed = false;
        posts.forEach(p => {
            const v = liveLikes.get(String(p.id));
            if (v !== undefined && v !== p.likes) {
                p.likes = v;
                changed = true;
            }
        });
        if (changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    }

    /* ---------------------------------------------------------------
       Incremental like ticking (cosmetic, but persistent)
       --------------------------------------------------------------- */
    function clearAllTickers() {
        tickers.forEach(t => clearTimeout(t));
        tickers.clear();
    }

    function startTickingLikes(postId, el) {
        const key = String(postId);

        function tick() {
            const current = liveLikes.get(key) || 0;
            const next = current + 1 + Math.floor(Math.random() * 3);
            liveLikes.set(key, next);
            el.textContent = '👍 ' + next.toLocaleString();
            updateStats();
            recordLikeHistory(key, next);

            const delay = Math.max(700, 4500 - next * 4 + Math.random() * 1200);
            tickers.set(key, setTimeout(tick, delay));
        }

        tickers.set(key, setTimeout(tick, 1200 + Math.random() * 1500));
    }

    /* ---------------------------------------------------------------
       Stats: total likes = sum of every post's live like count
               reach       = 4x total likes
       --------------------------------------------------------------- */
    function updateStats() {
        const posts = getPosts();
        document.getElementById('postCount').textContent = posts.length;

        let totalLikes = 0;
        posts.forEach(p => { totalLikes += getLiveLikes(p); });

        document.getElementById('totalLikes').textContent = totalLikes.toLocaleString();
        document.getElementById('totalReach').textContent = (totalLikes * 4).toLocaleString();
    }

    /* ---------------------------------------------------------------
       Render feed
       --------------------------------------------------------------- */
    function render() {
        clearAllTickers();

        const container = document.getElementById('postsContainer');
        const posts = getPosts();
        const name = localStorage.getItem(NAME_KEY) || 'You';

        document.getElementById('profileName').textContent = name;
        document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();

        if (posts.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="empty-icon">📝</span>
                    <p>You haven't made any permanent posts yet.<br>Select "Post" in the Feed to save them here!</p>
                </div>
            `;
            updateStats();
            return;
        }

        container.innerHTML = posts.map(post => {
            const likes = getLiveLikes(post);

            let mediaHtml = '';
            if (post.mediaUrl) {
                if (post.mediaType === 'video') {
                    mediaHtml = `<video class="post-video" src="${post.mediaUrl}" controls playsinline preload="metadata"></video>`;
                } else {
                    mediaHtml = `<img class="post-image" src="${post.mediaUrl}" alt="" loading="lazy" onerror="this.style.display='none'">`;
                }
            }

            const commentsHtml = (post.comments || []).map(c => `
                <div class="comment-item">
                    <div class="c-avatar" style="background:${c.color || '#ccc'};"></div>
                    <div class="c-bubble">
                        <div class="c-name">${c.name}</div>
                        <div>${c.text}</div>
                    </div>
                </div>
            `).join('');

            const dateStr = new Date(post.timestamp).toLocaleString([], {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            const commentCount = post.comments ? post.comments.length : 0;
            const key = String(post.id);
            const commentsOpen = expandedComments.has(key);

            return `
                <article class="post" data-id="${post.id}">
                    <button class="delete-btn" onclick="deletePost('${post.id}')" title="Delete Post">✕</button>
                    <div class="post-header">
                        <div class="avatar-small" style="background:linear-gradient(135deg, #1877f2, #7c3aed);">${name.charAt(0).toUpperCase()}</div>
                        <div class="post-meta">
                            <div class="post-name">${name}</div>
                            <div class="post-time">${dateStr}</div>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    ${mediaHtml}
                    <div class="actions">
                        <div class="action-item"><span class="likes-count" id="likes-${post.id}">👍 ${likes.toLocaleString()}</span></div>
                        ${commentCount > 0
                            ? `<button class="comments-toggle" id="comments-toggle-${post.id}" onclick="toggleComments('${post.id}')">
                                   💬 ${commentCount} <span class="ct-label">${commentCount === 1 ? 'comment' : 'comments'}</span><span class="chev">${commentsOpen ? '▲' : '▼'}</span>
                               </button>`
                            : `<div class="action-item">💬 0 comments</div>`}
                        <button class="analytics-btn" onclick="openAnalytics('${post.id}')">📊 Analytics</button>
                    </div>
                    ${commentCount > 0 ? `<div class="comments-section" id="comments-${post.id}" style="display:${commentsOpen ? 'block' : 'none'};">${commentsHtml}</div>` : ''}
                    <button class="ad-btn" onclick="openAdModal('${post.id}')">
                        Get more likes INSTANTLY with $1,000,000 FREE in ChillSpace Ads credit!
                    </button>
                </article>
            `;
        }).join('');

        // Start ticking for each post, continuing from its live count
        posts.forEach(post => {
            const el = document.getElementById(`likes-${post.id}`);
            if (el) startTickingLikes(post.id, el);
        });

        persistLikes();
        updateStats();
    }

    /* ---------------------------------------------------------------
       Comment collapse / expand
       --------------------------------------------------------------- */
    function toggleComments(postId) {
        const key = String(postId);
        const section = document.getElementById('comments-' + key);
        if (!section) return;

        const willOpen = !expandedComments.has(key);
        if (willOpen) expandedComments.add(key);
        else expandedComments.delete(key);

        section.style.display = willOpen ? 'block' : 'none';

        const btn = document.getElementById('comments-toggle-' + key);
        const chev = btn ? btn.querySelector('.chev') : null;
        if (chev) chev.textContent = willOpen ? '▲' : '▼';
    }

    /* ---------------------------------------------------------------
       Analytics modal
       --------------------------------------------------------------- */
    function openAnalytics(id) {
        const posts = getPosts();
        const post = posts.find(p => String(p.id) === String(id));
        if (!post) return;

        const currentLikesEl = document.getElementById(`likes-${id}`);
        const currentLikes = currentLikesEl ? parseInt(currentLikesEl.textContent.replace(/\D/g,'')) : 0;

        const performance = 100 + (currentLikes % 50);
        const peakHour    = new Date(post.timestamp).getHours();
        const reach       = Math.round(currentLikes * 1.5) + 120;
        const vibes       = ['nostalgia', 'minimalism', 'trending topics', 'wholesome content', 'deep discussions'][id.length % 5];

        const history = post.likeHistory || [currentLikes];
        const canvasId = `chart-${id}`;

        document.getElementById('analyticsContent').innerHTML = `
            <div style="text-align:left; font-size:14px; line-height:1.6;">
                <p><b>Performance:</b> ${performance}% of your average</p>
                <p><b>Total Reach:</b> ${reach.toLocaleString()} unique users</p>
                <div style="margin: 15px 0;">
                    <canvas id="${canvasId}" style="width:100%; height:120px; background:#f9fafb; border-radius:8px; border:1px solid #e4e6eb;"></canvas>
                </div>
                <p><b>Peak Engagement:</b> ${peakHour}:00 Local Time</p>
                <p><b>Virality Potential:</b> High 🔥</p>
                <div style="margin-top:12px; padding:10px; background:#f0f7ff; border-radius:8px; border-left:4px solid #1877f2;">
                    <i>"This post resonated with users who enjoy ${vibes}."</i>
                </div>
            </div>
        `;
        document.getElementById('analyticsOverlay').style.display = 'flex';

        // Draw the graph
        requestAnimationFrame(() => {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const w = rect.width;
            const h = rect.height;
            const pad = 15;
            const gW = w - pad * 2;
            const gH = h - pad * 2;

            const max = Math.max(...history) * 1.1 || 10;
            const min = Math.min(...history) * 0.9 || 0;
            const range = max - min;

            ctx.clearRect(0, 0, w, h);

            // Draw line
            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#1877f2';
            ctx.lineJoin = 'round';

            history.forEach((val, idx) => {
                const x = pad + (idx / (history.length - 1 || 1)) * gW;
                const y = pad + gH - ((val - min) / range) * gH;
                if (idx === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Draw points
            ctx.fillStyle = '#1877f2';
            history.forEach((val, idx) => {
                const x = pad + (idx / (history.length - 1 || 1)) * gW;
                const y = pad + gH - ((val - min) / range) * gH;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });
        });
    }

    function closeAnalytics() {
        document.getElementById('analyticsOverlay').style.display = 'none';
    }

    /* ---------------------------------------------------------------
       Ad credit modal (100% placebo, 0% accounting)
       --------------------------------------------------------------- */
    let adTargetPostId = null;

    function openAdModal(postId) {
        const posts = getPosts();
        const post = posts.find(p => String(p.id) === String(postId));
        if (!post) return;

        adTargetPostId = String(postId);
        document.getElementById('adSlider').value = 50;
        updateAdEstimate();
        document.getElementById('adOverlay').style.display = 'flex';
    }

    function closeAdModal() {
        document.getElementById('adOverlay').style.display = 'none';
        adTargetPostId = null;
    }

    // The "algorithm": more dollars, more likes. Diminishing-ish returns, generous curve.
    function adGrowthFor(spend) {
        return Math.round(spend * 10 + Math.pow(spend, 1.2));
    }

    function updateAdEstimate() {
        const slider = document.getElementById('adSlider');
        const spend = Number(slider.value);

        document.getElementById('adSpendAmount').textContent = '$' + spend.toLocaleString();
        document.getElementById('adEstimate').textContent =
            '+' + adGrowthFor(spend).toLocaleString() + ' likes';

        const pct = ((spend - 1) / 999) * 100;
        slider.style.background =
            `linear-gradient(to right, #1877f2 0%, #1877f2 ${pct}%, #e4e6eb ${pct}%, #e4e6eb 100%)`;
    }

    function purchaseAd() {
        if (!adTargetPostId) return;

        const spend = Number(document.getElementById('adSlider').value);
        const gain  = adGrowthFor(spend);
        const key   = adTargetPostId;

        const newTotal = (liveLikes.get(key) || 0) + gain;
        setLiveLikes(key, newTotal);
        persistLikes();
        recordLikeHistory(key, newTotal);

        const el = document.getElementById('likes-' + key);
        if (el) el.textContent = '👍 ' + newTotal.toLocaleString();

        updateStats();
        closeAdModal();
        showToast(`Ad space purchased for $${spend.toLocaleString()} — +${gain.toLocaleString()} likes! 🎉`);
    }

    /* ---------------------------------------------------------------
       Delete
       --------------------------------------------------------------- */
    function deletePost(id) {
        if (!confirm('Are you sure you want to delete this post and its media?')) return;

        const key = String(id);
        const posts = getPosts();
        const post = posts.find(p => String(p.id) === key);

        if (post && window.AndroidUtils && typeof window.AndroidUtils.deleteFile === 'function') {
            try {
                if (post.fileUri) window.AndroidUtils.deleteFile(post.fileUri);
                if (post.mediaUrl) window.AndroidUtils.deleteFile(post.mediaUrl);
            } catch (e) {}
        }

        // Stop its ticker and drop its like count
        if (tickers.has(key)) {
            clearTimeout(tickers.get(key));
            tickers.delete(key);
        }
        liveLikes.delete(key);
        expandedComments.delete(key);

        savePosts(posts.filter(p => String(p.id) !== key));
        render();
        showToast('Post deleted');
    }

    /* ---------------------------------------------------------------
       Toast
       --------------------------------------------------------------- */
    let toastTimer = null;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2600);
    }

    /* ---------------------------------------------------------------
       Engagement simulation (friend comments)
       --------------------------------------------------------------- */
    function simulateEngagement() {
        const posts = getPosts();

        if (posts.length > 0 && Math.random() < 0.4) {
            const luckyPost = posts[Math.floor(Math.random() * posts.length)];
            const friends = getFriends();

            if (friends.length > 0) {
                const friend = friends[Math.floor(Math.random() * friends.length)];
                if (!luckyPost.comments) luckyPost.comments = [];

                const alreadyCommented = luckyPost.comments.some(c => c.name === friend);
                if (!alreadyCommented || Math.random() < 0.1) {
                    luckyPost.comments.push({
                        name: friend,
                        text: getRandomFriendComment(),
                        color: ['#ef4444', '#10b981', '#8b5cf6', '#1877f2', '#f59e0b'][Math.floor(Math.random() * 5)]
                    });
                    savePosts(posts);
                    render();
                }
            }
        }
    }

    function getRandomFriendComment() {
        const replies = [
            "This is so cool! 🔥", "Love seeing your updates! 😊", "Wow, amazing!",
            "Great post! 🙌", "Keep it up!", "So true!", "I love this! ❤️",
            "Thanks for sharing!", "Legendary!", "Wholesome content only ✨"
        ];
        return replies[Math.floor(Math.random() * replies.length)];
    }

    /* ---------------------------------------------------------------
       Modal dismissal: click backdrop or press Escape
       --------------------------------------------------------------- */
    document.getElementById('analyticsOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'analyticsOverlay') closeAnalytics();
    });
    document.getElementById('adOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'adOverlay') closeAdModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeAnalytics(); closeAdModal(); }
    });

    /* ---------------------------------------------------------------
       Cross-tab sync
       --------------------------------------------------------------- */
    window.addEventListener('storage', (e) => {
        if (document.querySelector('video:not(:paused)')) return;
        if (e.key === NAME_KEY) render();
        if (e.key === STORAGE_KEY) { render(); updateStats(); }
    });

    /* ---------------------------------------------------------------
       Persist live likes periodically / before leaving
       --------------------------------------------------------------- */
    setInterval(persistLikes, 5000);
    window.addEventListener('beforeunload', persistLikes);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
            persistLikes();
        } else if (document.visibilityState === 'visible') {
            if (!document.querySelector('video:not(:paused)')) {
                render();
            }
        }
    });

    /* ---------------------------------------------------------------
       Boot
       --------------------------------------------------------------- */
    render();
    updateStats();

    setInterval(simulateEngagement, 10000);
</script>
</body>
