  function detectLang() {
    var list = [];
    if (navigator.languages) list = list.concat(navigator.languages);
    if (navigator.language) list.push(navigator.language);
    list.push('en');
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i] || '').toLowerCase();
      if (l.indexOf('ko') === 0) return 'ko';
      if (l.indexOf('ja') === 0) return 'ja';
      if (l.indexOf('es') === 0) return 'es';
      if (l.indexOf('pt') === 0) return 'pt';
      if (l.indexOf('ru') === 0) return 'ru';
      if (l.indexOf('en') === 0) return 'en';
    }
    return 'en';
  }

  var lang = detectLang();
  STRINGS[lang] = STRINGS[lang] || STRINGS.en;
  document.documentElement.lang = lang;

  function t(key) {
    var v = STRINGS[lang][key];
    if (v === undefined) v = STRINGS.en[key];
    return (v === undefined) ? key : v;
  }
  window.csT = t;

  function applyI18n() {
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: linear-gradient(135deg, #0f1e6e 0%, #312e81 42%, #6b21a8 100%);
    background-attachment: fixed;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* i18n handled by data-i18n attributes */

  .header { text-align: center; margin: 8px 0 32px; }
  .logo {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #06b6d4, #a78bfa 50%, #f0abfc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
  }
  .subtitle { font-size: 14px; color: rgba(255,255,255,0.7); margin: 6px 0 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
  }

  .tile {
    background: transparent;
    border: none;
    padding: 12px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    text-decoration: none;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .tile-icon {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: block;
  }
  .tile-icon svg { width: 100%; height: 100%; display: block; }

  .tile:hover .tile-icon,
  .tile:focus .tile-icon,
  .tile:focus-visible .tile-icon {
    transform: scale(1.07);
    box-shadow: 0 0 0 4px rgba(167,139,250,0.6), 0 10px 28px rgba(0,0,0,0.5);
  }

  .tile-label {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    line-height: 1.25;
    max-width: 100px;
    word-break: break-word;
  }

  @media (max-width: 480px) {
    body { padding: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 4px; }
    .tile-icon { width: 72px; height: 72px; border-radius: 18px; }
    .logo { font-size: 32px; }
    .tile-label { font-size: 12px; margin-top: 8px; }
  }
</style>
