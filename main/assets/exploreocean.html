<script>
/* ─── ChillSpace i18n — EN / KO / JA / ES / PT / RU (browser detection) ─── */
(function () {
  'use strict';
  var STRINGS = {
    en: {
      title: 'ChillSpace Explore — 2D',

      resetTitle: 'Reset position',

    ru: {

      fatal1: 'Для этой сцены нужен Canvas 2D.',
      fatal2: 'Ваш браузер заблокировал контекст 2D-canvas.',
      hint: 'Нажмите, чтобы скользить \u00b7 Удерживайте, чтобы продолжать дрейф<br>Нажмите на солнце или луну, чтобы сменить свет',
      phase_dawn: 'Рассвет', phase_day: 'День', phase_dusk: 'Закат', phase_night: 'Ночь',

  function detectLang() {
    var list = [];
    if (navigator.languages) list = list.concat(navigator.languages);
    if (navigator.language) list.push(navigator.language);
    list.push('en');
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i] || '').toLowerCase();
      if (l.indexOf('ko') === 0) return 'ko';
      if (l.indexOf('ja') === 0) return 'ja';
      if (l.indexOf('es') === 0) return 'es';
      if (l.indexOf('pt') === 0) return 'pt';
      if (l.indexOf('ru') === 0) return 'ru';
      if (l.indexOf('en') === 0) return 'en';
    }
    return 'en';
  }

  var lang = detectLang();
  STRINGS[lang] = STRINGS[lang] || STRINGS.en;
  document.documentElement.lang = lang;

  function t(key, vars) {
    var v = STRINGS[lang][key];
    if (v === undefined) v = STRINGS.en[key];
    var s = (v === undefined) ? key : v;
    if (vars) {
      for (var k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
    }
    return s;
  }
  window.csT = t;
  document.title = t('title');

  function applyI18n() {
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
      els[i].textContent = t(els[i].getAttribute('data-i18n'));

    var htmlEls = document.querySelectorAll('[data-i18n-html]');
    for (var i = 0; i < htmlEls.length; i++) {

    var orb = document.getElementById('orb');

      orb.setAttribute('aria-label', t('orbLabel', { current: t('phase_dawn'), next: t('phase_day') }));

    var resetBtn = document.getElementById('reset');
    if (resetBtn) {
      resetBtn.setAttribute('title', t('resetTitle'));
      resetBtn.setAttribute('aria-label', t('resetTitle'));
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyI18n);
  } else {

<style>
  :root{
    --fg: rgba(255,255,255,.92);
    --fg-dim: rgba(255,255,255,.55);
    --panel: rgba(12,18,28,.34);
    --border: rgba(255,255,255,.14);
    --accent: rgba(255,214,170,.95);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#080d14;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:var(--fg); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #scene{
    display:block;
    position:fixed; inset:0;
    width:100%; height:100%;
    touch-action:none; outline:none;
  }

  #brand{
    position:fixed; z-index:10; pointer-events:none;
    top:calc(clamp(16px,3vw,34px) + env(safe-area-inset-top, 0px));
    left:calc(clamp(16px,3vw,38px) + env(safe-area-inset-left, 0px));
    max-width:min(70vw,420px);
  }
  #brand h1{
    margin:0; font-size:clamp(18px,2.2vw,26px); font-weight:600; letter-spacing:.02em;
    text-shadow:0 2px 24px rgba(0,0,0,.55);
  }
  #brand h1 span{font-weight:300;color:var(--fg-dim)}
  #brand p{
    margin:6px 0 0; font-size:clamp(10px,1.05vw,12px); letter-spacing:.14em;
    text-transform:uppercase; color:var(--fg-dim);
    text-shadow:0 2px 18px rgba(0,0,0,.6);
  }


  #tools {position:fixed; top:max(16px,env(safe-area-inset-top)); right:max(16px,env(safe-area-inset-right)); display:flex; gap:7px; z-index:12}
  button,dialog {font:inherit;color:var(--fg)}
  #tools button,dialog button {background:#152332db;border:1px solid var(--border);border-radius:24px;padding:0 16px;min-height:44px;cursor:pointer}
  #orb {position:fixed;left:50%;padding:0;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;cursor:pointer;touch-action:manipulation}
  :focus-visible {outline:2px solid #ffdbad;outline-offset:3px}
  #hint {position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:92vw;text-align:center;font-size:12px;letter-spacing:.04em;color:#ebeff6;pointer-events:none;text-shadow:0 1px 6px #000}
  dialog {width:min(340px,92vw);max-height:86dvh;overflow:auto;background:#14212e;border:1px solid #465561;border-radius:18px;padding:22px;box-shadow:0 20px 80px #0008}
  dialog::backdrop {background:#050b1466}
  dialog header,dialog label {display:flex;align-items:center;justify-content:space-between;gap:12px}
  dialog h2 {font-size:20px;margin:0}
  dialog label {margin:20px 0 6px}
  dialog input {accent-color:#efc59c}
  dialog input[type=range] {width:100%;height:26px;margin:0}
  dialog output {font-variant-numeric:tabular-nums;color:#efc59c}
  @media(max-width:480px){#brand h1{font-size:16px}#brand p{font-size:9px}#tools button{padding:0 11px}}
  #loader{
    position:fixed; inset:0; z-index:50; display:grid; place-items:center;
    background:#080d14; transition:opacity .8s ease, visibility .8s ease;
  }
  #loader.hidden{opacity:0; visibility:hidden}
  #loader .inner{display:flex; flex-direction:column; align-items:center; gap:20px}
  #loader .ring{
    width:34px; height:34px; border-radius:50%;
    border:2px solid rgba(255,255,255,.14); border-top-color:var(--accent);
    animation:spin 1.1s linear infinite;
  }
  #loader p{
    margin:0; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--fg-dim);
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  #fatal{
    position:fixed; inset:0; z-index:60; display:none; place-items:center; padding:32px;
    background:#080d14; text-align:center; line-height:1.7; color:var(--fg-dim);
  }
  #fatal.show{display:grid}
  #fatal strong{color:var(--fg); font-size:15px; letter-spacing:.02em}
  #fatal .msg{opacity:.7; font-size:12px; margin-top:10px; word-break:break-word}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="brand">
  <h1>ChillSpace <span data-i18n="brandExplore">Explore</span></h1>
  <p data-i18n="brandSub">2D · Ocean Drift</p>
</div>

<button id="orb" aria-label="Dawn. Switch to day"></button>
<div id="tools"><button id="reset" title="Reset position" aria-label="Reset position">↺</button><button id="settings" data-i18n="settings">Settings</button></div>
<div id="hint" data-i18n-html="hint">Tap to glide · Hold to keep drifting<br>Tap the sun or moon to change the light</div>
<dialog id="panel" aria-labelledby="settings-title">
  <header><h2 id="settings-title" data-i18n="settings">Settings</h2><button id="close" data-i18n="done">Done</button></header>
  <label><span data-i18n="music">Gentle music</span> <input type="checkbox" id="music"></label>
  <div id="audio-status" role="status"></div>
  <label for="fish"><span data-i18n="fish">Fish</span> <output id="fish-count" for="fish">36</output></label><input id="fish" type="range" min="0" max="100" value="36">
  <label for="dolphins"><span data-i18n="dolphins">Dolphins</span> <output id="dolphins-count" for="dolphins">3</output></label><input id="dolphins" type="range" min="0" max="12" value="3">
  <label for="jellyfish"><span data-i18n="jellyfish">Jellyfish</span> <output id="jellyfish-count" for="jellyfish">7</output></label><input id="jellyfish" type="range" min="0" max="30" value="7">
</dialog>
<div id="loader">
  <div class="inner">
    <div class="ring"></div>
    <p data-i18n="drifting">Drifting</p>
  </div>
</div>

<div id="fatal">
  <div>
    <strong data-i18n="fatal1">This scene needs Canvas 2D.</strong>
    <div class="msg" data-i18n="fatal2">Your browser blocked the 2D canvas context.</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------
     Setup
  --------------------------------------------------------------- */
  const canvas = document.getElementById('scene');
  const ctx    = canvas.getContext('2d', { alpha: false });
  const loader = document.getElementById('loader');
  const fatal  = document.getElementById('fatal');

  if (!ctx) {
    fatal.classList.add('show');
    loader.classList.add('hidden');
    return;
  }

  let W = 0, H = 0, DPR = 1;
  let horizonY = 0, spanY = 1;

  /* ---------------------------------------------------------------
     Colour helpers
  --------------------------------------------------------------- */
  const hex2rgb = h => [
    parseInt(h.slice(1, 3), 16),
    parseInt(h.slice(3, 5), 16),
    parseInt(h.slice(5, 7), 16)
  ];
  const lerpC = (a, b, t) => [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
  const rgb = (c, a) => (a === undefined || a >= 1)
    ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'
    : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';

  const fract = x => x - Math.floor(x);
  const hash  = n => fract(Math.sin(n) * 43758.5453123);
  const TAU   = Math.PI * 2;
  const rnd   = (a, b) => a + Math.random() * (b - a);

  /* ---------------------------------------------------------------
     Palettes
  --------------------------------------------------------------- */
  const COLOR_KEYS = ['skyTop','skyMid','skyLow','horizon','sun','glow','seaFar','seaNear','foam'];
  const NUM_KEYS   = ['stars','sunElev','sunSize','haze','glitter'];

  const PALETTES = {
    dawn: {
      skyTop:  hex2rgb('#131e33'),
      skyMid:  hex2rgb('#4a3f63'),
      skyLow:  hex2rgb('#c98a72'),
      horizon: hex2rgb('#f2b489'),
      sun:     hex2rgb('#ffe6c4'),
      glow:    hex2rgb('#ff9e63'),
      seaFar:  hex2rgb('#3b4358'),
      seaNear: hex2rgb('#080d16'),
      foam:    hex2rgb('#ffd9b8'),
      stars: 0.18, sunElev: 0.135, sunSize: 42, haze: 0.85, glitter: 1.00
    },
    day: {
      skyTop:hex2rgb('#448abe'), skyMid:hex2rgb('#87cbe0'), skyLow:hex2rgb('#bbdfde'),
      horizon:hex2rgb('#f7e4be'), sun:hex2rgb('#fff6ce'), glow:hex2rgb('#ffdfa0'),
      seaFar:hex2rgb('#468599'), seaNear:hex2rgb('#103a52'), foam:hex2rgb('#c5f5ec'),
      stars:0, sunElev:0.29, sunSize:36, haze:0.52, glitter:0.83
    },
    dusk: {
      skyTop:  hex2rgb('#080b18'),
      skyMid:  hex2rgb('#241a3a'),
      skyLow:  hex2rgb('#7b3355'),
      horizon: hex2rgb('#e2695a'),
      sun:     hex2rgb('#ffcba4'),
      glow:    hex2rgb('#ff6a4d'),
      seaFar:  hex2rgb('#33293c'),
      seaNear: hex2rgb('#06080f'),
      foam:    hex2rgb('#ffb08a'),
      stars: 0.50, sunElev: 0.080, sunSize: 48, haze: 0.90, glitter: 1.15
    },
    night: {
      skyTop:  hex2rgb('#03060d'),
      skyMid:  hex2rgb('#081326'),
      skyLow:  hex2rgb('#12233c'),
      horizon: hex2rgb('#2b4664'),
      sun:     hex2rgb('#eaf2ff'),
      glow:    hex2rgb('#7fa8d8'),
      seaFar:  hex2rgb('#122236'),
      seaNear: hex2rgb('#03060b'),
      foam:    hex2rgb('#cfe2ff'),
      stars: 1.00, sunElev: 0.265, sunSize: 32, haze: 0.55, glitter: 0.70
    }
  };

  function clonePal(p) {
    const o = {};
    for (const k of COLOR_KEYS) o[k] = p[k].slice();
    for (const k of NUM_KEYS)   o[k] = p[k];
    return o;
  }
  function blendPal(a, b, t) {
    for (const k of COLOR_KEYS) {
      const ca = a[k], cb = b[k];
      ca[0] += (cb[0] - ca[0]) * t;
      ca[1] += (cb[1] - ca[1]) * t;
      ca[2] += (cb[2] - ca[2]) * t;
    }
    for (const k of NUM_KEYS) a[k] += (b[k] - a[k]) * t;
  }

  const cur    = clonePal(PALETTES.dawn);
  const target = clonePal(PALETTES.dawn);

  /* ---------------------------------------------------------------
     Stars
  --------------------------------------------------------------- */
  let stars = [];

  function buildStars() {
    const count = Math.round(Math.min(420, (W * H) / 4200));
    stars = new Array(count);
    for (let i = 0; i < count; i++) {
      stars[i] = {
        x:  Math.random(),
        y:  Math.pow(Math.random(), 1.35) * 0.86,
        r:  0.4 + Math.random() * 1.35,
        tw: Math.random() * TAU,
        sp: 0.6 + Math.random() * 1.9,
        b:  0.30 + Math.random() * 0.70
      };
    }
  }

  /* ---------------------------------------------------------------
     Vignette
  --------------------------------------------------------------- */
  let vignette = null;

  function buildVignette() {
    const cx = W * 0.5, cy = H * 0.55;
    vignette = ctx.createRadialGradient(
      cx, cy, Math.min(W, H) * 0.20,
      cx, cy, Math.max(W, H) * 0.82
    );
    vignette.addColorStop(0,    'rgba(0,0,0,0)');
    vignette.addColorStop(0.65, 'rgba(0,0,0,0.18)');
    vignette.addColorStop(1,    'rgba(0,0,0,0.62)');
  }

  /* ---------------------------------------------------------------
     World / camera  (translation only — the view never turns)
  --------------------------------------------------------------- */
  const world    = { x: 0, y: 0 };
  const worldTgt = { x: 0, y: 0 };

  // A repeating ocean plane lets the camera travel indefinitely on both axes.
  function depthAt(depth) {
    return fract(depth - world.y / Math.max(1, spanY * 2));
  }

  function screenX(wx, par) {
    const range = W + 360;
    let s = (wx - world.x * par) % range;
    if (s < 0) s += range;
    return s - 180;
  }

  const clouds = Array.from({length: 11}, (_, i) => ({
    x: fract(0.18 + i * 0.618),
    depth: (i + 0.5) / 11,
    width: 0.8 + 0.45 * hash(i + 2),
    puffs: Array.from({length: 8}, (_, n) => ({
      x: (n - 3.5) * 0.21,
      y: -0.22 * Math.sin(n * Math.PI / 7) + 0.12 * hash(i * 13 + n),
      radius: 0.20 + 0.23 * hash(i * 19 + n + 1)
    }))
  }));

  function drawClouds(time) {
    const cloudScale = Math.min(180, Math.max(75, W * 0.15));
    const margin = cloudScale * 2;
    const period = W + 2 * margin;
    const light = lerpC(cur.skyMid, cur.sun, 0.73 - cur.stars * 0.47);
    const shade = lerpC(cur.skyTop, cur.skyMid, 0.6);
    // Far banks sit near the horizon. Fade both ends of each depth cycle.
    for (const cloud of clouds) {
      const depth = fract(cloud.depth - world.y / (H * 8));
      const zoom = 1 + 1.6 * depth;
      const offset = fract(cloud.x + (time * 15 - world.x) * 0.09 / period) - 0.5;
      const x = W / 2 + offset * period * zoom;
      const y = horizonY * (0.94 - 1.03 * depth);
      const width = cloudScale * cloud.width * (0.4 + depth);
      if (x < -width * 1.3 || x > W + width * 1.3) continue;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(width, width * (0.22 + 0.23 * depth));
      ctx.globalAlpha = Math.min(1, depth * 13, (1 - depth) * 13) * 0.68;
      for (const puff of cloud.puffs) {
        const radius = puff.radius;
        const mist = ctx.createRadialGradient(puff.x, puff.y, 0, puff.x, puff.y, radius);
        mist.addColorStop(0, rgb(light, 0.8));
        mist.addColorStop(0.55, rgb(light, 0.54));
        mist.addColorStop(0.82, rgb(shade, 0.22));
        mist.addColorStop(1, rgb(shade, 0));
        ctx.fillStyle = mist;
        ctx.fillRect(puff.x - radius, puff.y - radius, radius * 2, radius * 2);
      }
      ctx.restore();
    }
  }

  /* ---------------------------------------------------------------
     Sea life
  --------------------------------------------------------------- */
  const fishes   = [];
  const jellies  = [];
  const dolphins = [];
  const splashes = [];

  function syncCounts() {
    const fishCount = +document.getElementById('fish').value;
    fishes.length = Math.min(fishes.length, fishCount);
    while (fishes.length < fishCount) {
      const depth = rnd(0.10, 0.92);
      const dir   = Math.random() < 0.5 ? -1 : 1;
      const spd   = rnd(18, 48) * dir;
      const n     = 4 + Math.floor(Math.random() * 8);
      const bx    = rnd(-200, W + 200);
      for (let i = 0; i < n && fishes.length < fishCount; i++) {
        fishes.push({
          x:     bx + rnd(-70, 70),
          depth: Math.max(0.05, Math.min(0.98, depth + rnd(-0.10, 0.10))),
          vx:    spd * rnd(0.85, 1.25),
          wob:   Math.random() * TAU,
          wobSp: rnd(1.6, 3.8),
          size:  rnd(0.7, 1.5)
        });
      }
    }

    // --- jellyfish ---
    const jc = +document.getElementById('jellyfish').value;
    jellies.length = Math.min(jellies.length, jc);
    while (jellies.length < jc) {
      jellies.push({
        x:     rnd(-150, W + 150),
        f:     rnd(0.25, 0.95),
        age:   0,
        parallax: rnd(0.62, 0.97),
        phase: Math.random() * TAU,
        sp:    rnd(0.8, 1.7),
        size:  rnd(13, 30)
      });
    }

    // --- dolphins ---
    const dc = +document.getElementById('dolphins').value;
    dolphins.length = Math.min(dolphins.length, dc);
    while (dolphins.length < dc) {
      dolphins.push({
        x:      rnd(0, W),
        depth:  rnd(0.30, 0.52),
        vx:     (Math.random() < 0.5 ? -1 : 1) * rnd(55, 110),
        vy:     0,
        y:      0,
        mode:   'swim',
        timer:  rnd(1.5, 8),
        phase:  Math.random() * TAU,
        size:   rnd(24, 40)
      });
    }
  }

  function splash(x, y) {
    const n = 9 + Math.floor(Math.random() * 9);
    for (let i = 0; i < n; i++) {
      const a  = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
      const sp = rnd(55, 200);
      splashes.push({
        x: x + rnd(-16, 16),
        y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: rnd(0.45, 1.05),
        r: rnd(0.7, 2.4)
      });
    }
  }

  /* ---------------------------------------------------------------
     Resize
  --------------------------------------------------------------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    horizonY = H * 0.46;
    spanY    = Math.max(1, H - horizonY);

    buildStars();
    buildVignette();
    syncCounts();
  }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  /* ---------------------------------------------------------------
     Navigation and settings
  --------------------------------------------------------------- */
  const orb = document.getElementById('orb');
  const phases = ['dawn','day','dusk','night'];
  let phase = 0;

  const phaseKey = { dawn: 'phase_dawn', day: 'phase_day', dusk: 'phase_dusk', night: 'phase_night' };
  function phaseLabel(p) {
    return window.csT('orbLabel', {
      current: window.csT(phaseKey[phases[p]]),
      next: window.csT(phaseKey[phases[(p + 1) % phases.length]])
    });
  }

  orb.addEventListener('click', () => {
    phase = (phase + 1) % phases.length;
    Object.assign(target, clonePal(PALETTES[phases[phase]]));
    orb.setAttribute('aria-label', phaseLabel(phase));
  });

  let press = null;
  const holdDelay = 220;

  function aimAtPointer() {
    worldTgt.x = world.x + press.x - W / 2;
    worldTgt.y = world.y + press.y - H / 2;
  }

  function endPress(event) {
    if (!press || (event.pointerId != null && event.pointerId !== press.id)) return;
    if (event.type !== 'pointerup' || performance.now() - press.start >= holdDelay) {
      worldTgt.x = world.x;
      worldTgt.y = world.y;
    }
    press = null;
  }

  canvas.addEventListener('pointerdown', e => {
    if (!e.isPrimary || e.button !== 0 || press) return;
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, start: performance.now() };
    canvas.setPointerCapture(e.pointerId);
    aimAtPointer();
  });
  canvas.addEventListener('pointermove', e => {
    if (!press || press.id !== e.pointerId) return;
    press.x = e.clientX;
    press.y = e.clientY;
  });
  for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    canvas.addEventListener(event, endPress);
  }
  window.addEventListener('blur', endPress);
  document.addEventListener('visibilitychange', e => { if (document.hidden) endPress(e); });

  const panel = document.getElementById('panel');
  document.getElementById('settings').onclick = () => { endPress({type:'settings'}); panel.showModal(); };
  document.getElementById('close').onclick = () => panel.close();
  for (const id of ['fish','jellyfish','dolphins']) {
    document.getElementById(id).oninput = e => {
      document.getElementById(id + '-count').value = e.target.value;
      syncCounts();
    };
  }
  const reset = () => { press = null; worldTgt.x = 0; worldTgt.y = 0; };
  document.getElementById('reset').onclick = reset;
  window.addEventListener('keydown', e => {
    if (!panel.open && e.key.toLowerCase() === 'r') reset();
  });

  const music = document.getElementById('music');
  let audio = null, melodyTimer = null;
  music.onchange = async () => {
    clearInterval(melodyTimer);
    const previous = audio;
    audio = null;
    if (previous) previous.close().catch(() => {});
    if (!music.checked) return;
    let session;
    try {
      session = new (window.AudioContext || window.webkitAudioContext)();
      audio = session;
      await session.resume();
      if (session !== audio) return;
      const notes = [50,57,62,64,57,59,55,62,66,64,59,57];
      let index = 0;
      function chime() {
        const t = session.currentTime;
        const voice = session.createOscillator(), gain = session.createGain();
        voice.frequency.value = 440 * 2 ** ((notes[index++ % notes.length] - 69) / 12);
        gain.gain.setValueAtTime(0.0001,t);
        gain.gain.exponentialRampToValueAtTime(0.075,t + 0.35);
        gain.gain.exponentialRampToValueAtTime(0.0001,t + 3.8);
        voice.connect(gain).connect(session.destination);
        voice.onended = () => { voice.disconnect(); gain.disconnect(); };
        voice.start(t); voice.stop(t + 4);
      }
      document.getElementById('audio-status').textContent = '';
      chime();
      melodyTimer = setInterval(chime, 1450);
    } catch {
      if (session && session !== audio) return;
      if (audio) audio.close().catch(() => {});
      audio = null;
      music.checked = false;
      document.getElementById('audio-status').textContent = window.csT('audioUnavailable');
    }
  };

  /* ---------------------------------------------------------------
     Creature drawing
  --------------------------------------------------------------- */
  function drawFish(x, y, sz, dir, alpha, col, t, phase) {
    const wag = Math.sin(t * 9 + phase) * 0.35;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir * sz, sz);
    ctx.fillStyle = rgb(col, alpha);

    // tail
    ctx.beginPath();
    ctx.moveTo(-0.55, 0);
    ctx.lineTo(-1.55, -0.55 + wag);
    ctx.quadraticCurveTo(-1.15, 0, -1.55, 0.55 + wag);
    ctx.closePath();
    ctx.fill();

    // body
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.95, 0.42, 0, 0, TAU);
    ctx.fill();

    // nose
    ctx.beginPath();
    ctx.moveTo(0.80, -0.21);
    ctx.lineTo(1.35, 0);
    ctx.lineTo(0.80, 0.21);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawJelly(x, y, sz, pulse, alpha, col) {
    const w = sz * (1 + 0.16 * pulse);
    const h = sz * (0.78 - 0.12 * pulse);

    // aura
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y - h * 0.4, 0, x, y - h * 0.4, sz * 2.6);
    g.addColorStop(0,   rgb(col, 0.24 * alpha));
    g.addColorStop(0.5, rgb(col, 0.08 * alpha));
    g.addColorStop(1,   rgb(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - h * 0.4, sz * 2.6, 0, TAU);
    ctx.fill();
    ctx.restore();

    // tentacles
    ctx.strokeStyle = rgb(col, 0.34 * alpha);
    ctx.lineWidth = Math.max(0.6, sz * 0.06);
    for (let i = 0; i < 6; i++) {
      const tx = x + (i / 5 - 0.5) * w * 1.15;
      ctx.beginPath();
      ctx.moveTo(tx, y);
      for (let s = 1; s <= 3; s++) {
        const yy = y + s * sz * 0.33;
        const xx = tx + Math.sin(s * 1.35 + i * 0.95 + pulse * 2.2) * sz * 0.15;
        ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }

    // bell
    ctx.beginPath();
    ctx.moveTo(x - w, y);
    ctx.quadraticCurveTo(x - w, y - h * 1.55, x, y - h * 1.55);
    ctx.quadraticCurveTo(x + w, y - h * 1.55, x + w, y);
    const lobes = 4;
    for (let i = lobes; i >= 1; i--) {
      const t0 = i / lobes, t1 = (i - 1) / lobes;
      const x0 = x - w + 2 * w * t0;
      const x1 = x - w + 2 * w * t1;
      ctx.quadraticCurveTo((x0 + x1) * 0.5, y + h * 0.38, x1, y);
    }
    ctx.closePath();

    const bg = ctx.createLinearGradient(x, y - h * 1.55, x, y + h * 0.4);
    bg.addColorStop(0, rgb(col, 0.58 * alpha));
    bg.addColorStop(1, rgb(col, 0.13 * alpha));
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = rgb(col, 0.50 * alpha);
    ctx.lineWidth = Math.max(0.6, sz * 0.045);
    ctx.stroke();
  }

  function drawDolphin(x, y, sz, vx, vy, alpha, col) {
    const faceLeft = vx < 0;
    const angle = Math.atan2(vy, Math.abs(vx) || 1);

    ctx.save();
    ctx.translate(x, y);
    if (faceLeft) { ctx.scale(-1, 1); ctx.rotate(angle); }
    else          { ctx.rotate(angle); }
    ctx.scale(sz, sz);
    ctx.fillStyle = rgb(col, alpha);

    ctx.beginPath();
    ctx.moveTo(1.05, 0.02);
    ctx.bezierCurveTo(0.75, -0.30, 0.30, -0.34, -0.05, -0.26);   // head / back
    ctx.lineTo(0.02, -0.60);                                      // dorsal fin
    ctx.lineTo(-0.34, -0.24);
    ctx.bezierCurveTo(-0.62, -0.18, -0.85, -0.14, -1.02, -0.40);  // tail upper fluke
    ctx.quadraticCurveTo(-0.90, -0.02, -1.02, 0.36);              // tail lower fluke
    ctx.bezierCurveTo(-0.85, 0.12, -0.62, 0.10, -0.34, 0.18);
    ctx.bezierCurveTo(0.05, 0.34, 0.65, 0.30, 1.05, 0.02);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  /* ---------------------------------------------------------------
     Update sea life
  --------------------------------------------------------------- */
  function updateCreatures(dt, time) {
    // ---- fish ----
    for (let i = 0; i < fishes.length; i++) {
      const f = fishes[i];
      f.x += f.vx * dt * (0.5 + f.depth * 0.9);
    }

    // ---- jellyfish ----
    for (let i = 0; i < jellies.length; i++) {
      const j = jellies[i];
      j.x += Math.sin(time * 0.42 + j.phase) * 11 * dt;
      j.f -= (0.008 + 0.013 * j.sp) * dt;
      j.age += dt;
    }

    // ---- dolphins ----
    for (let i = 0; i < dolphins.length; i++) {
      const d = dolphins[i];
      const base = spanY * d.depth;

      if (d.mode === 'swim') {
        d.x += d.vx * dt;
        d.y  = base + Math.sin(time * 1.4 + d.phase) * 9;
        d.timer -= dt;
        if (d.timer <= 0) {
          d.mode = 'leap';
          d.vy = -(600 + Math.random() * 230);
          d.vx = (d.vx >= 0 ? 1 : -1) * rnd(150, 240);
        }
      } else {
        d.vy += 1150 * dt;
        d.x  += d.vx * dt;
        d.y  += d.vy * dt;
        if (d.y >= base && d.vy > 0) {
          d.y = base;
          d.mode = 'swim';
          d.vy = 0;
          d.timer = rnd(6, 16);
          splash(screenX(d.x, 0.55 + 0.45 * d.depth), horizonY + spanY * depthAt(d.depth));
        }
      }
    }

    // ---- splashes ----
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.life -= dt;
      if (s.life <= 0) { splashes.splice(i, 1); continue; }
      s.vy += 620 * dt;
      s.x  += s.vx * dt;
      s.y  += s.vy * dt;
    }
  }

  function drawCreatures(time) {
    // ---------- fish ----------
    for (let i = 0; i < fishes.length; i++) {
      const f = fishes[i];
      const par = 0.50 + 0.60 * f.depth;
      const x = screenX(f.x, par);
      if (x < -90 || x > W + 90) continue;

      const bob = Math.sin(time * f.wobSp + f.wob) * (1 + 3.5 * f.depth);
      const y = horizonY + spanY * depthAt(f.depth) + bob;

      const sz    = (2.4 + 7.0 * f.depth) * f.size * (W < 640 ? 0.8 : 1);
      const alpha = 0.26 + 0.58 * f.depth;
      const col   = lerpC(cur.seaNear, cur.foam, 0.14 + 0.30 * f.depth);

      drawFish(x, y, sz, f.vx >= 0 ? 1 : -1, alpha, col, time, f.wob);
    }

    // ---------- jellyfish ----------
    for (let i = 0; i < jellies.length; i++) {
      const j = jellies[i];
      const x = screenX(j.x, j.parallax);
      if (x < -140 || x > W + 140) continue;

      const depth = depthAt(j.f);
      const y = horizonY + spanY * depth;
      const pulse = Math.sin(time * j.sp * 1.7 + j.phase);
      const sz = j.size * (0.50 + depth * 0.78) * (W < 640 ? 0.82 : 1);
      // Ease in newly added jellies and soften both sides of the depth wrap.
      const fade = Math.min(1, j.age / 2.5, depth / 0.09, (1 - depth) / 0.09);
      const opacity = fade * fade * (3 - 2 * fade);
      const alpha = (0.30 + 0.55 * Math.min(1, depth * 1.4)) * opacity;
      const col = lerpC(cur.foam, cur.glow, 0.35);

      drawJelly(x, y, sz, pulse, alpha, col);
    }

    // ---------- dolphins ----------
    for (let i = 0; i < dolphins.length; i++) {
      const d = dolphins[i];
      const par = 0.55 + 0.45 * d.depth;
      const x = screenX(d.x, par);
      if (x < -160 || x > W + 160) continue;

      const y = horizonY + spanY * depthAt(d.depth) + (d.y - spanY * d.depth);

      let vy = 0;
      if (d.mode === 'swim') {
        vy = Math.cos(time * 1.4 + d.phase) * 9 * 1.4;
      } else {
        vy = d.vy;
      }

      const col = lerpC(cur.seaFar, cur.foam, 0.42);
      drawDolphin(x, y, d.size, d.vx, vy, 0.90, col);
    }

    // ---------- splashes ----------
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < splashes.length; i++) {
      const s = splashes[i];
      const a = Math.min(1, s.life);
      ctx.fillStyle = rgb(cur.foam, a * 0.85);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (0.5 + a * 0.8), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ---------------------------------------------------------------
     Render
  --------------------------------------------------------------- */
  function render(time) {
    const sunX = W * 0.5;
    const sunY = horizonY - H * cur.sunElev;

    /* ---------- sky ---------- */
    const sky = ctx.createLinearGradient(0, 0, 0, Math.max(horizonY, 1));
    sky.addColorStop(0,    rgb(cur.skyTop));
    sky.addColorStop(0.55, rgb(cur.skyMid));
    sky.addColorStop(0.85, rgb(cur.skyLow));
    sky.addColorStop(1,    rgb(cur.horizon));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, Math.max(horizonY, 1));

    /* ---------- stars ---------- */
    if (cur.stars > 0.012) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        let sx = (s.x * W - world.x * 0.05) % W;
        if (sx < 0) sx += W;
        const sy = s.y * horizonY;
        if (sy > horizonY) continue;

        const tw = 0.55 + 0.45 * Math.sin(time * s.sp + s.tw);
        const a = s.b * tw * cur.stars;
        if (a < 0.012) continue;

        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(sx, sy, s.r, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    /* ---------- sun bloom ---------- */
    const scale = Math.max(0.7, Math.min(1.65, Math.min(W, H) / 800));
    const sunR = cur.sunSize * scale;
    orb.style.top = sunY + 'px';
    orb.style.width = orb.style.height = Math.max(48, sunR * 2.4) + 'px';

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const glowR = Math.max(W, H) * (0.55 + cur.haze * 0.35);
    const g = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, glowR);
    g.addColorStop(0,    rgb(cur.glow, 0.50));
    g.addColorStop(0.22, rgb(cur.glow, 0.20));
    g.addColorStop(0.55, rgb(cur.glow, 0.06));
    g.addColorStop(1,    rgb(cur.glow, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, Math.max(horizonY, 1));

    const core = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3.4);
    core.addColorStop(0,    rgb(cur.sun, 1.00));
    core.addColorStop(0.30, rgb(cur.sun, 0.85));
    core.addColorStop(0.55, rgb(cur.glow, 0.26));
    core.addColorStop(1,    rgb(cur.glow, 0));
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR * 3.4, 0, TAU);
    ctx.fill();
    ctx.restore();

    drawClouds(time);

    /* ---------- sea base ---------- */
    const seaGrad = ctx.createLinearGradient(0, horizonY, 0, H);
    seaGrad.addColorStop(0,    rgb(cur.seaFar));
    seaGrad.addColorStop(0.22, rgb(lerpC(cur.seaFar, cur.seaNear, 0.48)));
    seaGrad.addColorStop(1,    rgb(cur.seaNear));
    ctx.fillStyle = seaGrad;
    ctx.fillRect(0, horizonY, W, spanY + 1);

    /* ---------- sun reflection ---------- */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(sunX, horizonY);
    ctx.scale(1, 3.0);
    const rr = Math.max(W * 0.14, 90);
    const refl = ctx.createRadialGradient(0, 0, 0, 0, 0, rr);
    refl.addColorStop(0,    rgb(cur.glow, 0.34 * cur.glitter));
    refl.addColorStop(0.40, rgb(cur.glow, 0.11 * cur.glitter));
    refl.addColorStop(1,    rgb(cur.glow, 0));
    ctx.fillStyle = refl;
    ctx.fillRect(-rr, 0, rr * 2, rr);
    ctx.restore();

    /* ---------- waves ---------- */
    const rows = W < 640 ? 52 : 66;
    const step = Math.max(7, Math.round(W / 170));
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 0; i < rows; i++) {
      const p = depthAt(i / rows);
      const pp = Math.pow(p, 2.3);

      // vertical bob of the near water (the horizon itself never moves)
      const y = horizonY + spanY * pp;

      const amp   = (0.6 + 26 * pp * pp) * (0.55 + H / 1400);
      const k     = 0.010 + 0.055 * (1 - pp);
      const par   = world.x * (0.25 + 0.85 * pp);
      const speed = 0.55 + 0.85 * (1 - pp);
      const phase = i * 0.7;
      const alpha = 0.05 + 0.30 * pp;

      const seaC  = lerpC(cur.seaFar, cur.seaNear, Math.min(1, Math.pow(pp, 0.75)));
      const crest = lerpC(seaC, cur.foam, 0.38 - 0.16 * pp);

      ctx.beginPath();
      for (let x = -step; x <= W + step; x += step) {
        const wx = x + par;
        const wy = y + amp * (
          Math.sin(wx * k + time * speed + phase) * 0.55 +
          Math.sin(wx * k * 2.17 - time * speed * 1.4 + phase * 1.7) * 0.27 +
          Math.sin(wx * k * 0.47 + time * speed * 0.6 + phase * 0.5) * 0.42
        );
        if (x === -step) ctx.moveTo(x, wy);
        else             ctx.lineTo(x, wy);
      }
      ctx.strokeStyle = rgb(crest, alpha);
      ctx.lineWidth = 1 + 1.6 * pp;
      ctx.stroke();
    }

    /* ---------- sea life ---------- */
    drawCreatures(time);

    /* ---------- horizon haze ---------- */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const hz = ctx.createLinearGradient(0, horizonY - H * 0.02, 0, horizonY + H * 0.20);
    hz.addColorStop(0, rgb(cur.horizon, 0.30 * cur.haze));
    hz.addColorStop(1, rgb(cur.horizon, 0));
    ctx.fillStyle = hz;
    ctx.fillRect(0, horizonY - H * 0.02, W, H * 0.22);
    ctx.restore();

    /* ---------- glitter ---------- */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gCount = W < 640 ? 90 : 150;
    for (let i = 0; i < gCount; i++) {
      const r1 = hash(i * 12.9898 + 0.31);
      const r2 = hash(i * 78.2330 + 1.77);
      const r3 = hash(i * 37.7190 + 4.13);

      const d  = Math.pow(r1, 0.75);
      const pp = Math.pow(d, 2.2);

      const spread = W * (0.02 + 0.30 * pp) * (0.5 + cur.glitter * 0.5);
      const x = sunX + (r2 - 0.5) * 2 * spread;
      if (x < -40 || x > W + 40) continue;

      const wob = Math.sin(time * (1.2 + r3 * 2.4) + i * 1.7);
      const y = horizonY + spanY * pp + wob * (1 + 4 * pp);

      const a = (0.10 + 0.55 * pp) * (0.30 + 0.70 * Math.max(0, wob)) * cur.glitter;
      if (a < 0.02) continue;

      const rx = (1.2 + 12 * pp) * (0.6 + r3 * 0.8);
      const ry = 0.8 + 2.4 * pp;

      ctx.fillStyle = rgb(cur.foam, Math.min(1, a));
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    /* ---------- vignette ---------- */
    if (vignette) {
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ---------------------------------------------------------------
     Loop
  --------------------------------------------------------------- */
  let last = performance.now();
  let time = 0;
  let firstFrame = true;

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);
    time += dt;

    blendPal(cur, target, 1 - Math.exp(-2.4 * dt));

    if (press && now - press.start >= holdDelay) aimAtPointer();
    const k = 1 - Math.exp(-2.3 * dt);
    world.x += (worldTgt.x - world.x) * k;
    world.y += (worldTgt.y - world.y) * k;

    updateCreatures(dt, time);

    ctx.save();
    render(time);
    ctx.restore();

    if (firstFrame) {
      firstFrame = false;
      setTimeout(() => loader.classList.add('hidden'), 320);
    }

    requestAnimationFrame(frame);
  }

  /* ---------------------------------------------------------------
     Go
  --------------------------------------------------------------- */
  resize();
  requestAnimationFrame(frame);
})();
</script>
